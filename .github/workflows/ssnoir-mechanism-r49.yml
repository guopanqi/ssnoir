name: SSNoir Abstract Mechanism Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ssnoir-mechanism-r49.yml'
      - 'tools/content-validator/experiments/r49_delayed_target_*'
      - 'UnityClient/Assets/Resources/Content/scenes/encounters/研究·迟到的目标.scm'
      - 'tools/content-validator/experiments/r50_recent_action.py'
      - 'tools/content-validator/experiments/r50_heuristic_audit.py'
      - 'tools/content-validator/experiments/r50_native_smoke.py'
      - 'UnityClient/Assets/Resources/Content/scenes/encounters/研究·动作回声.scm'
      - 'docs/实验/机制研究/模式库.json'
      - 'docs/实验/机制研究/研究总览.template.html'
      - 'docs/实验/机制研究/研究总览.html'
      - 'tools/content-validator/experiments/build_mechanism_atlas.py'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify human-facing research atlas against pattern library
        run: python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
      - name: Exact structural screening
        run: python3 tools/content-validator/experiments/r49_delayed_target_model.py --output /tmp/r49-screening.json
      - name: Screen R50 reversible prior-action effects
        run: python3 tools/content-validator/experiments/r50_recent_action.py > /tmp/r50-screening.json
      - name: R50 interpretable heuristic audit
        run: python3 tools/content-validator/experiments/r50_heuristic_audit.py --output /tmp/r50-heuristics.json
      - name: Print R50 heuristic policy differences
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r50-heuristics.json",encoding="utf-8"))
          for row in data["results"]:
              print(json.dumps({"skill":row["skill"],
                                "free":row["expectation"]["free"],
                                "fixed":row["expectation"]["fixed"],
                                "rule":row["expectation"]["understandable"],
                                "unexplained_rule_gap":row["remaining_gap_vs_rules"]},
                               ensure_ascii=False))
          PY
      - name: Build official headless engine
        run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: Validate the one official Content tree
        run: dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --validate
      - name: Real C# session, reveal, settlement and strict replay
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/r49_delayed_target_smoke.py | tee /tmp/r49-native.json
      - name: Real R50 reversible modifier native sessions and strict replay
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/r50_native_smoke.py | tee /tmp/r50-native.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r49-abstract-mechanism-evidence
          path: |
            /tmp/r49-screening.json
            /tmp/r50-screening.json
            /tmp/r50-heuristics.json
            /tmp/r49-native.json
            /tmp/r50-native.json
            docs/实验/机制研究/研究总览.html
            docs/实验/机制研究/模式库.json
          retention-days: 14
