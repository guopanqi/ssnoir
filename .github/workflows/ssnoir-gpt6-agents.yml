name: SSNoir Three GPT-6 Research Agents

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssnoir-gpt6-research
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official Agents SDK without invoking a model
        run: |
          python3 -m pip install openai-agents
          python3 - <<'PY'
          from agents import Agent, Runner, function_tool
          for name in ('pressure', 'route', 'information'):
              agent = Agent(name=name, model='gpt-6-astra', instructions='read-only smoke')
              assert agent.model == 'gpt-6-astra'
          assert callable(Runner.run)
          print('3 official GPT-6 Astra SDK agent configurations constructed; no API calls')
          PY
      - name: Validate runtime without making API calls
        run: |
          python3 -m py_compile tools/mechanism-agents/runner.py tools/mechanism-agents/verify.py
          python3 tools/mechanism-agents/verify.py --self-test
          for lane in pressure route information; do
            python3 tools/mechanism-agents/runner.py --lane "$lane" --dry-run
          done

  researcher:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [pressure, route, information]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Agents SDK
        run: python3 -m pip install openai-agents
      - name: Start independent GPT-6 Astra research agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 tools/mechanism-agents/runner.py \
            --lane "${{ matrix.lane }}" \
            --out "out/${{ matrix.lane }}"
      - name: Preserve individual agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-gpt6-${{ matrix.lane }}
          path: out/${{ matrix.lane }}/
          if-no-files-found: ignore
          retention-days: 90

  verify:
    needs: researcher
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: ssnoir-gpt6-*
          path: artifacts/
          merge-multiple: false
      - name: Validate and run GENERATED proofs (no API key in this job)
        run: |
          python3 tools/mechanism-agents/verify.py --root artifacts --out verified
      - name: Preserve verified evidence and audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-gpt6-independent-verification
          path: verified/
          if-no-files-found: ignore
          retention-days: 90
