name: SSNoir R76-R78 Diverse Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-r76-r78.yml'
      - 'tools/content-validator/experiments/r76_r78_diverse_relations.py'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact option-value ablations for three non-clock decision forms
        run: |
          python3 tools/content-validator/experiments/r76_r78_diverse_relations.py /tmp/r76-r78.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r76-r78.json'))
          assert [r["id"] for r in d["results"]]==["R76","R77","R78"]
          for row in d["results"]:
              assert row["direct_option_gain"]>=0
              print(row["id"],row["direct_option_gain"],row["strict_starting_hands"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-r76-r78-diverse-option-audits
          path: /tmp/r76-r78.json
          retention-days: 45
