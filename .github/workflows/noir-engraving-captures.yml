name: Noir Engraving Captures

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/noir-engraving-lab/**'
      - '.github/workflows/noir-engraving-captures.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/noir-engraving-lab/**'
      - '.github/workflows/noir-engraving-captures.yml'

permissions:
  contents: write

concurrency:
  group: noir-engraving-captures
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/noir-engraving-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run capture

      - name: Upload benchmark captures
        uses: actions/upload-artifact@v4
        with:
          name: noir-engraving-captures
          path: experiments/noir-engraving-lab/captures/latest
          if-no-files-found: error

      - name: Commit latest benchmark captures
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/noir-engraving-lab/captures/latest
          if git diff --cached --quiet; then
            echo "No capture changes."
          else
            git commit -m "更新 Noir Engraving 基准截图 [skip ci]"
            git push
          fi
