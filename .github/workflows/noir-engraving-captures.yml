name: Noir Engraving Captures

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/noir-engraving-lab/**'
      - '.github/workflows/noir-engraving-captures.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/noir-engraving-lab/**'
      - '.github/workflows/noir-engraving-captures.yml'

permissions:
  contents: read

concurrency:
  group: noir-engraving-captures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/noir-engraving-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run capture

      - name: Upload benchmark captures
        uses: actions/upload-artifact@v4
        with:
          name: noir-engraving-captures-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: experiments/noir-engraving-lab/captures/latest
          if-no-files-found: error
