name: SSNoir Autonomous R79-R81
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-r79-r81.yml'
      - 'tools/content-validator/experiments/r79_r81_adversarial_rounds.py'
      - 'tools/content-validator/experiments/r56_r65_autonomous_search.py'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R79 R80 R81 exact rational ablations
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/r79_r81_adversarial_rounds.py /tmp/r79-r81.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r79-r81.json',encoding='utf8'))
          assert [c['id'] for c in d['cases']]==['R79','R80','R81']
          for row in d['cases']:
              print(json.dumps(row,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r79-r81-autonomous-ablation
          path: /tmp/r79-r81.json
          retention-days: 60
