name: SSNoir Mechanism Research Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-mechanism-pages.yml'
      - 'docs/实验/机制研究/模式库.json'
      - 'docs/实验/机制研究/模式语言知识地图.json'
      - 'docs/实验/机制研究/研究沟通.json'
      - 'docs/实验/机制研究/试玩任务.json'
      - 'docs/实验/机制研究/研究总览.template.html'
      - 'docs/实验/机制研究/研究总览.html'
      - 'tools/content-validator/experiments/build_mechanism_atlas.py'
      - 'tools/content-validator/experiments/mechanism_cloud_feedback.js'
      - 'tools/content-validator/experiments/mechanism_workbench.css'
      - 'tools/content-validator/experiments/mechanism_workbench.js'
      - 'experiments/research-workbench-gpt6/**'
      - 'docs/实验/机制研究/批次/2026-10-13-行动权利与自主他者/试玩.html'
      - 'tools/content-validator/experiments/test_partner_prototype.js'
      - 'tools/content-validator/experiments/test_relational_field_study.js'
      - 'docs/实验/机制研究/批次/2026-10-13-关系许可与成果保全/试玩.html'
      - 'docs/实验/机制研究/批次/2026-10-13-策略回应与危机可达性/协商试玩.html'
      - 'tools/content-validator/experiments/test_strategic_refusal_field_study.js'
      - 'docs/实验/机制研究/批次/2026-10-13-策略回应与危机可达性/危机试玩.html'
      - 'tools/content-validator/experiments/test_crisis_opening_study.js'
      - 'docs/实验/机制研究/批次/2026-10-13-情境选择与注意力验证/证词与时限.html'
      - 'tools/content-validator/experiments/test_witness_vignette.js'
      - 'docs/实验/机制研究/批次/2026-10-13-压力转移与隐藏触发/压力分配.html'
      - 'tools/content-validator/experiments/test_pressure_transfer_prototype.js'
      - 'Game/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ssnoir-mechanism-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Full multi-platform regression runs in ssnoir-game-foundation.yml.
      # Keep the public preview deploy independent of long-running Node
      # content parity tests so live previews are not indefinitely cancelled
      # by concurrent agents on main.
      - name: Typecheck and build SSNoir gameplay preview
        working-directory: Game
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build:web
      - name: Build and validate research webpage
        run: |
          python3 tools/content-validator/experiments/build_mechanism_atlas.py
          python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
          mkdir -p pages-dist
          cp docs/实验/机制研究/研究总览.html pages-dist/index.html
          mkdir -p pages-dist/open-field
          cp experiments/research-workbench-gpt6/index.html pages-dist/open-field/index.html
          node tools/content-validator/experiments/test_partner_prototype.js
          mkdir -p pages-dist/actor
          cp docs/实验/机制研究/批次/2026-10-13-行动权利与自主他者/试玩.html pages-dist/actor/index.html
          test -s pages-dist/actor/index.html
          node tools/content-validator/experiments/test_relational_field_study.js
          mkdir -p pages-dist/relational
          cp docs/实验/机制研究/批次/2026-10-13-关系许可与成果保全/试玩.html pages-dist/relational/index.html
          test -s pages-dist/relational/index.html
          node tools/content-validator/experiments/test_strategic_refusal_field_study.js
          mkdir -p pages-dist/negotiation
          cp docs/实验/机制研究/批次/2026-10-13-策略回应与危机可达性/协商试玩.html pages-dist/negotiation/index.html
          test -s pages-dist/negotiation/index.html
          node tools/content-validator/experiments/test_crisis_opening_study.js
          mkdir -p pages-dist/crisis
          cp docs/实验/机制研究/批次/2026-10-13-策略回应与危机可达性/危机试玩.html pages-dist/crisis/index.html
          test -s pages-dist/crisis/index.html
          node tools/content-validator/experiments/test_witness_vignette.js
          mkdir -p pages-dist/witness
          cp docs/实验/机制研究/批次/2026-10-13-情境选择与注意力验证/证词与时限.html pages-dist/witness/index.html
          test -s pages-dist/witness/index.html
          node tools/content-validator/experiments/test_pressure_transfer_prototype.js
          mkdir -p pages-dist/pressure
          cp docs/实验/机制研究/批次/2026-10-13-压力转移与隐藏触发/压力分配.html pages-dist/pressure/index.html
          test -s pages-dist/pressure/index.html
          mkdir -p pages-dist/game
          cp -R Game/dist/web/. pages-dist/game/
          test -s pages-dist/game/index.html
          test -d pages-dist/game/assets
          touch pages-dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload research pages and playable game preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - name: Deploy research webpage
        uses: actions/deploy-pages@v4
        id: deployment
