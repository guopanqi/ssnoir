name: SSNoir Mechanism Research Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-mechanism-pages.yml'
      - 'experiments/抽象决策关系研究/模式库.json'
      - 'experiments/抽象决策关系研究/模式语言知识地图.json'
      - 'experiments/抽象决策关系研究/研究沟通.json'
      - 'experiments/抽象决策关系研究/试玩任务.json'
      - 'experiments/抽象决策关系研究/研究总览.template.html'
      - 'experiments/抽象决策关系研究/研究总览.html'
      - 'tools/content-validator/experiments/build_mechanism_atlas.py'
      - 'tools/content-validator/experiments/mechanism_cloud_feedback.js'
      - 'tools/content-validator/experiments/mechanism_workbench.css'
      - 'tools/content-validator/experiments/mechanism_workbench.js'
      - 'experiments/研究工作台原型/**'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-行动权利与自主他者/试玩.html'
      - 'tools/content-validator/experiments/test_partner_prototype.js'
      - 'tools/content-validator/experiments/test_relational_field_study.js'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-关系许可与成果保全/试玩.html'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-策略回应与危机可达性/协商试玩.html'
      - 'tools/content-validator/experiments/test_strategic_refusal_field_study.js'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-策略回应与危机可达性/危机试玩.html'
      - 'tools/content-validator/experiments/test_crisis_opening_study.js'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-情境选择与注意力验证/证词与时限.html'
      - 'tools/content-validator/experiments/test_witness_vignette.js'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-压力转移与隐藏触发/压力分配.html'
      - 'tools/content-validator/experiments/test_pressure_transfer_prototype.js'
      - 'experiments/抽象决策关系研究/批次/2026-10-13-目标生成与生产性发现/试玩.html'
      - 'tools/content-validator/experiments/test_productive_discovery_prototype.js'
      - 'Game/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ssnoir-mechanism-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Full multi-platform regression runs in ssnoir-game-foundation.yml.
      # Keep the public preview deploy independent of long-running Node
      # content parity tests so live previews are not indefinitely cancelled
      # by concurrent agents on main.
      - name: Typecheck and build SSNoir gameplay preview
        working-directory: Game
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build:web
      - name: Build and validate research webpage
        run: |
          python3 tools/content-validator/experiments/build_mechanism_atlas.py
          python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
          mkdir -p pages-dist
          cp experiments/抽象决策关系研究/研究总览.html pages-dist/index.html
          mkdir -p pages-dist/open-field
          cp experiments/研究工作台原型/index.html pages-dist/open-field/index.html
          node tools/content-validator/experiments/test_partner_prototype.js
          mkdir -p pages-dist/actor
          cp experiments/抽象决策关系研究/批次/2026-10-13-行动权利与自主他者/试玩.html pages-dist/actor/index.html
          test -s pages-dist/actor/index.html
          node tools/content-validator/experiments/test_relational_field_study.js
          mkdir -p pages-dist/relational
          cp experiments/抽象决策关系研究/批次/2026-10-13-关系许可与成果保全/试玩.html pages-dist/relational/index.html
          test -s pages-dist/relational/index.html
          node tools/content-validator/experiments/test_strategic_refusal_field_study.js
          mkdir -p pages-dist/negotiation
          cp experiments/抽象决策关系研究/批次/2026-10-13-策略回应与危机可达性/协商试玩.html pages-dist/negotiation/index.html
          test -s pages-dist/negotiation/index.html
          node tools/content-validator/experiments/test_crisis_opening_study.js
          mkdir -p pages-dist/crisis
          cp experiments/抽象决策关系研究/批次/2026-10-13-策略回应与危机可达性/危机试玩.html pages-dist/crisis/index.html
          test -s pages-dist/crisis/index.html
          node tools/content-validator/experiments/test_witness_vignette.js
          mkdir -p pages-dist/witness
          cp experiments/抽象决策关系研究/批次/2026-10-13-情境选择与注意力验证/证词与时限.html pages-dist/witness/index.html
          test -s pages-dist/witness/index.html
          node tools/content-validator/experiments/test_pressure_transfer_prototype.js
          mkdir -p pages-dist/pressure
          cp experiments/抽象决策关系研究/批次/2026-10-13-压力转移与隐藏触发/压力分配.html pages-dist/pressure/index.html
          test -s pages-dist/pressure/index.html
          node tools/content-validator/experiments/test_productive_discovery_prototype.js
          mkdir -p pages-dist/discovery
          cp experiments/抽象决策关系研究/批次/2026-10-13-目标生成与生产性发现/试玩.html pages-dist/discovery/index.html
          test -s pages-dist/discovery/index.html
          mkdir -p pages-dist/game
          cp -R Game/dist/web/. pages-dist/game/
          test -s pages-dist/game/index.html
          test -d pages-dist/game/assets
          # A release marker must travel in the same Pages artifact as the game.
          # This distinguishes a successful build from a stale live deployment.
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > pages-dist/game/version.json
          touch pages-dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload research pages and playable game preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      # One-time reconciliation for the old timed-out Pages deployment.
      # Its workflow reported cancellation, but the Pages backend continued to
      # reject newer releases as "in progress". Only touch this known stale SHA;
      # never cancel whichever deployment happens to be running concurrently.
      - name: Reconcile orphaned Pages deployment before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old=ac4e82368e3e3264326636beeb8465f818bb3a13
          api="repos/$GITHUB_REPOSITORY/pages/deployments/$old"
          status="$(gh api "$api" --jq '.status' 2>/dev/null || true)"
          case "$status" in
            ""|succeed|success|cancelled|canceled|failed|error)
              echo "Previous Pages deployment is no longer active: ${status:-not found}"
              ;;
            *)
              echo "Canceling confirmed stale Pages deployment $old (status: $status)"
              gh api --method POST "$api/cancel" >/dev/null
              for attempt in $(seq 1 20); do
                status="$(gh api "$api" --jq '.status' 2>/dev/null || true)"
                case "$status" in
                  ""|succeed|success|cancelled|canceled|failed|error)
                    echo "Previous Pages deployment released: ${status:-not found}"
                    break ;;
                esac
                sleep 3
              done
              ;;
          esac
      - name: Deploy research webpage
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public game release matches this commit
        env:
          LIVE_GAME_URL: https://guopanqi.github.io/ssnoir/game
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 15               "$LIVE_GAME_URL/?rev=$GITHUB_SHA" -o /tmp/ssnoir-live-game.html &&
              curl --fail --location --silent --show-error --max-time 15               "$LIVE_GAME_URL/version.json?rev=$GITHUB_SHA" -o /tmp/ssnoir-live-version.json &&
              node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("/tmp/ssnoir-live-version.json","utf8")); if(data.commit!==process.env.GITHUB_SHA) process.exit(1);' &&
              grep -q 'assets/' /tmp/ssnoir-live-game.html; then
              echo "Verified public /game/ for $GITHUB_SHA"
              exit 0
            fi
            echo "Public game has not propagated yet (attempt $attempt/30)"
            sleep 4
          done
          echo "::error::Pages artifact deployed, but the public /game/ does not match $GITHUB_SHA"
          exit 1
      - name: Install Chromium for live game acceptance
        working-directory: Game
        run: npx playwright install --with-deps chromium
      - name: Play fresh game, save, reject bad save and restore on public Pages
        working-directory: Game
        env:
          SSNOIR_WEB_BASE_URL: https://guopanqi.github.io/ssnoir/game/
        run: npm run smoke:web
      - name: Measure real location navigation, save and restore on published Pages
        working-directory: Game
        env:
          SSNOIR_BENCH_BASE_URL: https://guopanqi.github.io/ssnoir/game/
          SSNOIR_BENCH_ASSERT_BUDGET: '1'
          SSNOIR_BENCH_OUTPUT: artifacts/public-web-interactions.json
        run: npm run bench:web
      - name: Preserve public Pages interaction timings and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-public-pages-interaction-evidence
          path: |
            Game/artifacts/public-web-interactions.json
            Game/artifacts/public-web-interactions.png
          if-no-files-found: warn
