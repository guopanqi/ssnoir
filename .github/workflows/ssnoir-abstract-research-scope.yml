name: SSNoir Abstract Research Scope
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-abstract-research-scope.yml'
      - 'tools/content-validator/experiments/validate_abstract_research_scope.py'
      - 'docs/实验/机制研究/README.md'
      - 'docs/实验/机制研究/研究定位与评价.md'
      - 'docs/实验/机制研究/实验结构与维护契约.md'
      - 'docs/实验/机制研究/研究约定.md'
      - 'docs/实验/机制研究/研究队列.md'
      - 'docs/实验/机制研究/当前状态.md'
      - 'docs/实验/机制研究/自主研究记忆.json'
      - 'docs/实验/机制研究/抽象探索地图-20261012校准.md'
      - 'docs/实验/机制研究/归档/2026-10-12-方向校准前/**'
      - 'docs/实验/机制研究/模式库.json'
      - 'docs/实验/机制研究/试玩任务.json'
      - 'docs/实验/机制研究/研究总览.html'
      - 'skills/research-mechanisms/SKILL.md'
      - 'tools/content-validator/experiments/pattern_endogenous_goals_20261013.py'
      - 'tools/content-validator/experiments/pattern_objective_rights_20261013.py'
      - 'docs/实验/机制研究/批次/2026-10-13-目标图因果交互与强策略复核/**'
      - 'docs/实验/机制研究/批次/2026-10-13-行动权利与自主他者/**'
      - 'tools/content-validator/experiments/pattern_rights_actor_20261013.py'
      - 'tools/content-validator/experiments/pattern_relational_salvage_20261013.py'
      - 'tools/content-validator/experiments/pattern_portable_salvage_20261013.py'
      - 'tools/content-validator/experiments/pattern_bargaining_incentives_20261013.py'
      - 'docs/实验/机制研究/批次/2026-10-13-可信协商与策略性拒绝/**'
      - 'tools/content-validator/experiments/test_relational_field_study.js'
      - 'docs/实验/机制研究/批次/2026-10-13-关系许可与成果保全/**'
      - 'tools/content-validator/experiments/test_partner_prototype.js'
      - 'tools/content-validator/experiments/pattern_crisis_from_opening_20261013.py'
      - 'tools/content-validator/experiments/pattern_objective_affordance_20261013.py'
      - 'tools/content-validator/experiments/pattern_pressure_transfer_20261013.py'
      - 'tools/content-validator/experiments/pattern_pressure_information_20261013.py'
      - 'tools/content-validator/experiments/pattern_generated_obligations_20261013.py'
      - 'tools/content-validator/experiments/pattern_productive_discovery_20261013.py'
      - 'tools/content-validator/experiments/pattern_noisy_discovery_20261013.py'
      - 'tools/content-validator/experiments/pattern_reciprocal_actions_20261013.py'
      - 'docs/实验/机制研究/批次/2026-10-13-双向动作余效与操作顺序/**'
      - 'tools/content-validator/experiments/test_productive_discovery_prototype.js'
      - 'docs/实验/机制研究/批次/2026-10-13-目标生成与生产性发现/**'
      - 'tools/content-validator/experiments/test_pressure_transfer_prototype.js'
      - 'docs/实验/机制研究/批次/2026-10-13-压力转移与隐藏触发/**'
      - 'tools/content-validator/experiments/test_witness_vignette.js'
      - 'docs/实验/机制研究/批次/2026-10-13-情境选择与注意力验证/**'
      - 'docs/实验/机制研究/批次/2026-10-13-目标语义与行动权对照/**'
      - 'tools/content-validator/experiments/test_strategic_refusal_field_study.js'
      - 'tools/content-validator/experiments/test_crisis_opening_study.js'
      - 'docs/实验/机制研究/批次/2026-10-13-策略回应与危机可达性/**'
permissions:
  contents: read
jobs:
  research-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm abstract scope, preserved historical evidence and curated access
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/validate_abstract_research_scope.py
          python3 tools/content-validator/experiments/validate_mechanism_portfolio.py
          python3 tools/content-validator/experiments/validate_debug_playtests.py
          python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
          python3 tools/content-validator/experiments/validate_pattern_language_map.py
          python3 tools/content-validator/experiments/pattern_endogenous_goals_20261013.py
          python3 tools/content-validator/experiments/pattern_objective_rights_20261013.py
          python3 tools/content-validator/experiments/pattern_rights_actor_20261013.py
          python3 tools/content-validator/experiments/pattern_relational_salvage_20261013.py
          python3 tools/content-validator/experiments/pattern_portable_salvage_20261013.py
          python3 tools/content-validator/experiments/pattern_bargaining_incentives_20261013.py
          python3 tools/content-validator/experiments/pattern_crisis_from_opening_20261013.py
          python3 tools/content-validator/experiments/pattern_objective_affordance_20261013.py
          python3 tools/content-validator/experiments/pattern_pressure_transfer_20261013.py
          python3 tools/content-validator/experiments/pattern_pressure_information_20261013.py
          python3 tools/content-validator/experiments/pattern_generated_obligations_20261013.py
          python3 tools/content-validator/experiments/pattern_productive_discovery_20261013.py
          python3 tools/content-validator/experiments/pattern_noisy_discovery_20261013.py
          python3 tools/content-validator/experiments/pattern_reciprocal_actions_20261013.py
          node tools/content-validator/experiments/test_productive_discovery_prototype.js
          node tools/content-validator/experiments/test_pressure_transfer_prototype.js
          node tools/content-validator/experiments/test_witness_vignette.js
          node tools/content-validator/experiments/test_strategic_refusal_field_study.js
          node tools/content-validator/experiments/test_crisis_opening_study.js
          node tools/content-validator/experiments/test_relational_field_study.js
          node tools/content-validator/experiments/test_partner_prototype.js
