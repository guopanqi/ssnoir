name: SSNoir S3 第二节并发关注关系
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-s3-attention.yml'
      - 'tools/content-validator/experiments/s3_second_section_attention.py'
      - 'tools/content-validator/experiments/s3_arrival_deadline_counterfactual.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3-source-constrained-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 精确计算、最强公开规则、正常路径与四项反事实
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_second_section_attention.py /tmp/s3-section2.json
          python3 - <<'PY'
          from fractions import Fraction as F
          import json
          r=json.load(open('/tmp/s3-section2.json'))
          c=r['core']
          assert c['normal_public_state_count'] > 8
          assert F(c['optimal']) >= F(c['strong_global']) >= 0
          assert F(c['optimal']) >= F(c['strong_day_specific'])
          assert F(c['optimal']) >= F(c['best_legible_including_fixed'])
          assert F(c['normal_optimal_expected_visits_with_multiple_actions']) > 0
          a=r['ablations']
          assert F(a['disable_eddie']) <= F(c['optimal'])
          assert F(a['remove_solo_first_gate']) >= F(c['optimal'])
          assert F(a['remove_observed_eddie_same_evening_deadline']) >= F(c['optimal'])
          assert F(a['remove_two_lead_convergence_reward']) <= F(c['optimal'])
          assert r['source_boundary']['eddie_unobserved_event_has_no_public_clock']
          summary={"optimal":c["optimal"],"best_fixed":c["strong_global"],"best_day_rule":c["strong_day_specific"],"best_public_rule":c["best_legible_including_fixed"],"strict_vs_fixed_visits":c["strict_departure_from_strong_fixed_expected_visits"],"eddie_over_solo":c["strict_eddie_over_solo_expected_visits"],"solo_over_eddie":c["strict_solo_over_eddie_expected_visits"],"eddie_over_dock":c["strict_eddie_over_dock_expected_visits"],"dock_over_eddie":c["strict_dock_over_eddie_expected_visits"],"main_prob":c["probability_joint_dock_and_help"],"eddie_prob":c["probability_completed_eddie"],"first_witnesses":c["strict_witnesses"][:5],"ablations":a,"reward_one":{"optimal":r["eddie_reward_boundaries"]["reward_one"]["optimal"],"eddie_over_dock":r["eddie_reward_boundaries"]["reward_one"]["strict_eddie_over_dock_expected_visits"]},"reward_two":{"optimal":r["eddie_reward_boundaries"]["reward_two"]["optimal"],"eddie_over_dock":r["eddie_reward_boundaries"]["reward_two"]["strict_eddie_over_dock_expected_visits"]}}
          print('S3-METRICS '+json.dumps(summary,ensure_ascii=False))
          print('S3纸面：期限和并发、最强简单规则、正常可达轨迹及四项消融通过')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s3-第二节并发纸面审查
          path: /tmp/s3-section2.json
          retention-days: 90
  s3-visible-eddie-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 独立同状态仅更改艾迪期限的前向选择反证
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_arrival_deadline_counterfactual.py /tmp/s3-deadline.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          x=json.load(open('/tmp/s3-deadline.json'))
          assert F(x['remove_only_seen_eddie_deadline'])>=F(x['full_optimal'])
          assert F(x['both_eddie_dock_legal_expected_visits'])>0
          print('S3-DEADLINE '+json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s3-艾迪到场触发期限反证
          path: /tmp/s3-deadline.json
          retention-days: 90
