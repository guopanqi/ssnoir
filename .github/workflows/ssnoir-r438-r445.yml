name: SSNoir R438-R445 Offstage Agency Negative Baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-r438-r445.yml'
      - 'tools/content-validator/experiments/r438_r445_offstage_contribution.py'
      - 'docs/实验/机制研究/批次/R438-R445-场外出力与互补/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offstage actor, adaptive witness, and fixed baselines
        run: |
          set -euo pipefail
          python3 -m py_compile tools/content-validator/experiments/r438_r445_offstage_contribution.py
          python3 tools/content-validator/experiments/r438_r445_offstage_contribution.py >/tmp/r438.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/r438.json'))
          assert x['R438_static_adaptive_optimum']=='15/2'
          assert x['R439_all_fixed_16']['best']=='6'
          assert len(x['R439_all_fixed_16']['winners'])==16
          assert x['R442_one_full_turn_lag']=='7'
          assert x['R444_no_stable_type_fresh_each_turn']=='6'
          print('R438-R445 offstage coverage, transparent one-line optimum confirmed')
          PY
      - name: Guard prior abstract research admission
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/validate_abstract_research_scope.py
          python3 tools/content-validator/experiments/validate_mechanism_portfolio.py
          python3 tools/content-validator/experiments/validate_debug_playtests.py
          python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-r438-r445
          path: /tmp/r438.json
          retention-days: 21
