name: SSNoir S3-W 金牌烟原生守恒
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-s3-cigarette-native.yml'
      - 'tools/content-validator/experiments/s3_gold_cigarette_native.py'
      - 'tools/content-validator/experiments/s3_one_item_option_bound.py'
      - 'tools/content-validator/experiments/s3_world_entry_probe.py'
      - 'tools/content-validator/experiments/s3_world_cigarette_route.py'
      - 'tools/content-validator/experiments/s3_world_full_item_conservation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-lyon-item-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 构建游戏正式 C#+Scheme 内容校验器
        run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 原版莱恩交锋无烟、有一份烟的逐手证据
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_gold_cigarette_native.py /tmp/s3-cigarette-native.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s3-cigarette-native.json'))['controls']
          assert not x['unowned']['usable_before']
          assert x['owned']['before_count']==1
          assert x['owned']['after_count']==0
          assert not x['owned']['item_can_be_spent_again']
          assert x['owned']['transcript'] and x['unowned']['transcript']
          print('正式交锋：无物品禁用，持有物品可用并消费一次（测试夹具，不是全世界贯通）')
          PY
      - name: 两份实际决策记录各自严格重放
        run: |
          set -euo pipefail
          dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --replay /tmp/s3-w-lyon-item-0.json
          dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --replay /tmp/s3-w-lyon-item-1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-W-原版莱恩交锋物品前后
          path: |
            /tmp/s3-cigarette-native.json
            /tmp/s3-w-lyon-item-0.json
            /tmp/s3-w-lyon-item-1.json
          if-no-files-found: ignore
          retention-days: 90
  simple-policy-ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 证明单份物证强策略公式与独立消融
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_one_item_option_bound.py /tmp/s3-option-bound.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/s3-option-bound.json'))
          assert p['cases'][0]['signal_marginal']=='0'
          assert p['cases'][2]['signal_marginal']=='1'
          print('不额外给人物价值的纸面规则反证通过：简单阈值完整解释模型')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s3-W-纸面单份物证消融
          path: /tmp/s3-option-bound.json
          retention-days: 90
  original-world-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 原始世界新档入口探索（不注入阶段、不声称贯通）
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_world_entry_probe.py /tmp/s3-world-entry.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s3-world-entry.json'))
          assert x['initial_fixture']['items']=={}
          assert x['steps']
          print('S3-WORLD',x['status'],'steps',len(x['steps']),
            'final_day',x['steps'][-1]['observation']['day'],
            'focus',x['steps'][-1]['observation']['focus'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-W-正式世界自然入口调查
          path: /tmp/s3-world-entry.json
          if-no-files-found: ignore
          retention-days: 90
  bounded-natural-world-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 无伪造物品或主线阶段的原始世界正常路径检查
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_world_cigarette_route.py /tmp/s3-natural-route.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s3-natural-route.json'))
          assert x['settings']['items']=={}
          assert x['native_steps']
          print('S3-NATURAL-WORLD',x['status'],'native_steps',len(x['native_steps']),
            'got_cigarette',x['item_naturally_acquired'],
            'counter_spent',x['counter_spent'])
          if 'last_public_observation' in x:
              print('LAST-OBS',json.dumps(x['last_public_observation'],ensure_ascii=False))
          if x['obstacles']:
              print('BLOCKER',json.dumps(x['obstacles'],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-W-从新档到柜台的有界真实行动记录
          path: /tmp/s3-natural-route.json
          if-no-files-found: ignore
          retention-days: 90
  original-world-through-lyon:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 同一正式世界存档自然取得并消费金牌烟后尝试进入莱恩交锋
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_world_full_item_conservation.py /tmp/s3-full-world.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s3-full-world.json'))
          assert x['settings']['items']=={}
          assert x['native_steps']
          print('S3-FULL-WORLD',x['status'],'steps',len(x['native_steps']),
            'cigarette_obtained',x['item_naturally_acquired'],'counter_spent',x['counter_spent'])
          if x['status']=='same_original_world_counter_then_lyon_unusable':
              assert x['lyon_card_visible'] and not x['lyon_item_action_legal']
              assert x['lyon_inventory']==0
              print('同一世界存档：从获得物证到交出，再到莱恩交锋确实不能第二次使用')
          if 'last_public_observation' in x:
              print('LAST-OBS',json.dumps(x['last_public_observation'],ensure_ascii=False))
          if x.get('obstacles'):
              print('BLOCKER',json.dumps(x['obstacles'],ensure_ascii=False))
          if x.get('milestones'):
              print('MILESTONES',json.dumps(x['milestones'],ensure_ascii=False))
          PY
      - name: 同存档65步若走通则验证完整正式回放指纹
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/s3-w-same-world-to-lyon.json ]]; then
            dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --replay /tmp/s3-w-same-world-to-lyon.json
          else
            echo '此情形未贯通；保留原始世界阻塞记录，不把未跑的回放标记成通过'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-W-同一世界归档到莱恩进场
          path: |
            /tmp/s3-full-world.json
            /tmp/s3-w-same-world-to-lyon.json
          if-no-files-found: ignore
          retention-days: 90
