name: SSNoir S3-X 物证保留与公开信息证据
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-s3-x-evidence.yml'
      - 'tools/content-validator/experiments/s3_world_full_item_conservation.py'
      - 'tools/content-validator/experiments/s3_world_keep_cigarette.py'
      - 'tools/content-validator/experiments/s3_world_without_cigarette.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-world-keep-for-lyon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建不修改的正式 C# + Scheme 执行器
        run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 同一新档保留金牌烟，到莱恩时作选择
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_world_keep_cigarette.py /tmp/s3-x-keep.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/s3-x-keep.json'))
          assert r['settings']['items']=={}
          assert r['status']=='same_original_world_saved_for_lyon_spent',r.get('obstacles')
          assert r['item_naturally_acquired'] and not r['counter_spent']
          assert r['lyon_item_executed'] and r['lyon_inventory_before']==1 and r['lyon_inventory_after']==0
          print('S3-X-KEEP',r['status'],'operations',len(r['native_steps']),
                'counter_spent',r['counter_spent'],'item_obtained',r['item_naturally_acquired'])
          if r.get('obstacles'):print('BLOCKERS',json.dumps(r['obstacles'],ensure_ascii=False))
          if r.get('last_public_observation'):print('LAST',json.dumps(r['last_public_observation'],ensure_ascii=False))
          PY
      - name: 保留路线走通时严格复放65步相关原世界会话
        shell: bash
        run: |
          if [ -f /tmp/s3-w-retained-world-to-lyon.json ]; then
            dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --replay /tmp/s3-w-retained-world-to-lyon.json
          else
            echo '原生路径未贯通，只有阻塞报告，不称严格回放成功'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-x-正常新档保留物证与莱恩对质
          path: |
            /tmp/s3-x-keep.json
            /tmp/s3-w-retained-world-to-lyon.json
          if-no-files-found: ignore
          retention-days: 90
  original-world-no-cigarette-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译现有原生执行器
        run: dotnet build tools/content-validator/SSNoir.ContentValidator.csproj -nologo -v q
      - name: 正常第一封信追逐不取物证的后续路线
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s3_world_without_cigarette.py /tmp/s3-x-no-item.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s3-x-no-item.json'))
          assert x['settings']['items']=={}
          assert x['status']=='same_original_world_no_cigarette_reached_lyon',x.get('obstacles')
          assert x['lyon_card_visible'] and not x['lyon_item_action_legal'] and x['lyon_inventory']==0
          assert x['alternative_action_executed'],x.get('alternative_actions')
          assert x['alternative_action_selected'] in ('摊开那两封信','提她现在的样子')
          print('S3-X-NO-ITEM',x['status'],'operations',len(x['native_steps']),
                'item_acquired',x['item_naturally_acquired'])
          if x.get('obstacles'):print('BLOCKERS',json.dumps(x['obstacles'],ensure_ascii=False))
          if x.get('last_public_observation'):print('LAST',json.dumps(x['last_public_observation'],ensure_ascii=False))
          PY
      - name: 无烟原生已走通时严格回放
        run: |
          if [ -f /tmp/s3-x-no-cigarette-world-to-lyon.json ]; then
            dotnet run --no-build --project tools/content-validator/SSNoir.ContentValidator.csproj -- --replay /tmp/s3-x-no-cigarette-world-to-lyon.json
          else
            echo '正常无物证路径未贯通，本次只存真实阻塞记录'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-s3-x-原生无烟路线上下文
          path: |
            /tmp/s3-x-no-item.json
            /tmp/s3-x-no-cigarette-world-to-lyon.json
          if-no-files-found: ignore
          retention-days: 90
