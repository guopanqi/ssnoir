name: SSNoir Abstract Pattern Regression

on:
  push:
    branches: [main]
    paths:
      - 'tools/content-validator/experiments/pattern_*_20261015.py'
      - 'tools/content-validator/experiments/pattern_return_session_20261016.py'
      - 'tools/content-validator/experiments/pattern_repeated_censored_events_20261016.py'
      - 'tools/content-validator/experiments/pattern_information_audience_20261016.py'
      - 'tools/content-validator/experiments/pattern_route_signal_mixing_20261016.py'
      - 'tools/content-validator/experiments/pattern_dual_stakes_custody_20261016.py'
      - 'tools/content-validator/experiments/pattern_result_identity_frontier_20261016.py'
      - 'tools/content-validator/experiments/pattern_third_party_bond_20261016.py'
      - 'tools/content-validator/experiments/run_pattern_research_regressions.py'
      - '.github/workflows/research-pattern-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regressions:
    name: Exact model regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run standard-library regression suite
        run: python3 tools/content-validator/experiments/run_pattern_research_regressions.py
