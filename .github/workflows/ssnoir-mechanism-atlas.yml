name: SSNoir Mechanism Research Atlas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ssnoir-mechanism-atlas.yml'
      - 'docs/实验/机制研究/模式库.json'
      - 'docs/实验/机制研究/研究总览.template.html'
      - 'docs/实验/机制研究/研究总览.html'
      - 'tools/content-validator/experiments/build_mechanism_atlas.py'
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate curated patterns, source references and HTML parity
        run: python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
      - name: Upload offline research artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-abstract-pattern-atlas
          path: |
            docs/实验/机制研究/研究总览.html
            docs/实验/机制研究/模式库.json
          retention-days: 30
