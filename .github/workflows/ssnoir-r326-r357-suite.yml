name: SSNoir R326-R357 Integrated Research Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-r326-r357-suite.yml'
      - 'docs/实验/机制研究/自主研究记忆.json'
      - 'docs/实验/机制研究/当前状态.md'
      - 'docs/实验/机制研究/研究队列.md'
      - 'docs/实验/机制研究/批次/R326-R357-跨机制质量审计/**'
      - 'docs/实验/机制研究/批次/R334-R341-位置改变合法行动/参与者卡片.md'
      - 'docs/实验/机制研究/批次/R350-R357-自主贡献与等待观察/参与者卡片.md'
      - 'tools/content-validator/experiments/r326_r333_action_seals_evidence.py'
      - 'tools/content-validator/experiments/r334_r341_position_action_rights.py'
      - 'tools/content-validator/experiments/r342_r349_renegotiation.py'
      - 'tools/content-validator/experiments/r350_r357_other_contributor.py'
permissions:
  contents: read
jobs:
  four-families:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently run four frozen abstract models and verify rollup
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/r326_r333_action_seals_evidence.py >/tmp/r326-r333.json
          python3 tools/content-validator/experiments/r334_r341_position_action_rights.py >/tmp/r334-r341.json
          python3 tools/content-validator/experiments/r342_r349_renegotiation.py >/tmp/r342-r349.json
          python3 tools/content-validator/experiments/r350_r357_other_contributor.py >/tmp/r350-r357.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=[json.loads(Path('/tmp/'+name+'.json').read_text()) for name in ('r326-r333','r334-r341','r342-r349','r350-r357')]
          assert [d['schema'] for d in data]==[
            'ssnoir.r326-r333.action-seals-evidence.v1',
            'ssnoir.r334-r341.position-opportunity.v1',
            'ssnoir.r342-r349.renegotiation-and-rights.v1',
            'ssnoir.r350-r357.shared-progress.v1']
          assert data[0]['R326_main_sealed_penalty3']['closed']=='13/4'
          assert data[1]['R334_stable_target']['best']=='3'
          assert data[2]['R342_two_round_commitment']['optimal']=='17/4'
          assert data[3]['R350_main_partial_information']=='5'
          memo=json.loads(Path('docs/实验/机制研究/自主研究记忆.json').read_text())
          assert memo['totalArchivedRounds']==302 and memo['roundsSinceCalibration']==184
          assert memo['totalArchivedRounds']==118+memo['roundsSinceCalibration']
          assert sum(x['rounds'] for x in memo['history'])==184
          assert len(memo['history'])<=3
          print('FOUR ABSTRACT FAMILIES AND 32-CHECK MEMORY RECOVERY PASS')
          PY
      - name: Paper cards privacy, no human-feedback fabrication and artifact identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('docs/实验/机制研究/批次')
          left=(root/'R334-R341-位置改变合法行动/参与者卡片.md').read_text()
          shared=(root/'R350-R357-自主贡献与等待观察/参与者卡片.md').read_text()
          key=(root/'R326-R357-跨机制质量审计/研究员纸面规约.md').read_text()
          for text in (left,shared):
              assert len(text)>350
              assert '数学最优' not in text and '固定最优' not in text
          assert '尚未开展' in key and '不可交给参与者' in key
          assert 'SCOUT' in left and 'RECIP' in shared
          print('PAPER CARDS PREPARED, NOT PLAYTESTED; PUBLIC RULES DO NOT LEAK ANSWER')
          PY
      - name: Existing abstract scope, mechanism selection and Debug white list
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/validate_abstract_research_scope.py
          python3 tools/content-validator/experiments/validate_mechanism_portfolio.py
          python3 tools/content-validator/experiments/validate_debug_playtests.py
          python3 tools/content-validator/experiments/build_mechanism_atlas.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssnoir-r326-r357-four-abstract-families
          path: |
            /tmp/r326-r333.json
            /tmp/r334-r341.json
            /tmp/r342-r349.json
            /tmp/r350-r357.json
          retention-days: 21
