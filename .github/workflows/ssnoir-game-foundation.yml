name: SSNoir Game Foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'Game/**'
      - 'UnityClient/Assets/Resources/Content/scripts/stdlib.scm'
      - '.github/workflows/ssnoir-game-foundation.yml'
  pull_request:
    paths:
      - 'Game/**'
      - '.github/workflows/ssnoir-game-foundation.yml'
permissions:
  contents: read
  statuses: write
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify foundation
        run: npm run verify
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and capture
        run: npm run capture
      - name: WeChat compiled bundle on mocked wx browser host
        run: npm run smoke:wechat-harness
      - name: Electron smoke (virtual display)
        run: xvfb-run -a npm run smoke:desktop
      - name: Publish commit validation status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.RESULT === "success" ? "success" : "failure";
          const response = await fetch(
            `https://api.github.com/repos/${process.env.REPO}/statuses/${process.env.COMMIT_SHA}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              },
              body: JSON.stringify({
                state, context: "ssnoir/game-foundation",
                description: state === "success" ? "Scheme, browser, and platform bundles passed" : "Foundation validation failed; inspect run logs",
                target_url: process.env.RUN_URL
              })
            }
          );
          if (!response.ok) throw new Error(`Cannot publish CI status: ${response.status} ${await response.text()}`);
          console.log(`Published status ${state} to ${process.env.COMMIT_SHA}`);
          NODE
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-game-foundation
          path: |
            Game/dist/web
            Game/dist/wechat
            Game/artifacts/*.png
          retention-days: 7
