name: SSNoir Web Game
on:
  workflow_dispatch:
  push:
    paths:
      - 'Game/**'
      - 'UnityClient/Assets/Resources/Content/**'
      - '.github/workflows/ssnoir-game-foundation.yml'
  pull_request:
    paths:
      - 'Game/**'
      - '.github/workflows/ssnoir-game-foundation.yml'
permissions:
  contents: read
jobs:
  web-game:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Game/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, runtime tests and production Web build
        run: npm run verify
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify playable Web boot and capture
        run: npm run smoke:web
      - name: Verify full first-act route (day one through farewell)
        run: npm run test:route
      - name: Upload Web preview and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssnoir-web-game
          path: |
            Game/dist/web
            Game/artifacts/web-game-*.png
          retention-days: 14
