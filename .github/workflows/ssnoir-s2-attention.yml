name: SSNoir S2 Attention Network Mathematical Research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssnoir-s2-attention.yml'
      - 'tools/content-validator/experiments/s2_attention_information.py'
      - 'tools/content-validator/experiments/s2_goal_network.py'
      - 'tools/content-validator/experiments/s2_temporal_commitment.py'
      - 'tools/content-validator/experiments/s2_microcity_attention.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  information-and-time:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact Fraction R110-R112
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s2_attention_information.py > /tmp/S2-A.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          j=json.load(open('/tmp/S2-A.json'))
          assert [x['r'] for x in j['studies']]==['R110','R111','R112']
          a,b,c=j['studies']
          assert a['after_first']==a['outset_revealed']=='2113/864'
          assert a['never']==a['after_second']=='1049/432'
          assert a['revelation_gain']=='5/288'
          assert any(F(x['adaptive_above_simple'])>0 for x in b['results'])
          assert all(F(x['adaptive_above_simple'])==0 for x in c['results'])
          print('R110-R112: exact opportunity/revelation/expiry evidence OK; no native evidence')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s2-information-time
          path: /tmp/S2-A.json
  goal-network-and-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact Fraction R113-R115
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s2_goal_network.py > /tmp/S2-B.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          j=json.load(open('/tmp/S2-B.json'))
          assert [x['r'] for x in j['studies']]==['R113','R114','R115']
          a,b,c=j['studies']
          mid=next(x for x in a['results'] if x['B_reward']=='3/2')
          assert mid['full']=='161/81' and mid['best_fixed_priority_order']['gap']=='0'
          assert all(x['coupling_gain']=='0' for x in b['results'])
          tight=next(x for x in c['results'] if x['side_reward']=='1' and x['work_tax']=='1')
          assert tight['coupling_gain']=='1/4'
          assert F(tight['best_simple_threshold']['gap'])>=0
          print('R113-R115: exact unlock/debt/scarcity evidence OK; no native evidence')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s2-goal-network
          path: /tmp/S2-B.json
  multi-day-and-policy-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact Fraction R116-R118
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s2_temporal_commitment.py > /tmp/S2-C.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          s=json.load(open('/tmp/S2-C.json'))['studies']
          assert [x['r'] for x in s]==['R116','R117','R118']
          x=next(v for v in s[0]['rows'] if v['A_reward']=='3/2')
          assert x['optimal']=='307/162' and x['best_simple']['gap']=='0'
          assert all(y['remaining_gap']=='0' for y in s[1]['rows'] if y['side_reward']!='1/2')
          x=next(v for v in s[2]['rows'] if v['A_reward']=='2' and v['B_reward']=='1')
          assert F(x['paid_preserve_gain'])==F(1,27)
          print('R116-R118: 2-day conflict, strong simple rule and conditional carryover checks passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s2-temporal-commitment
          path: /tmp/S2-C.json
  integrated-microcity-and-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact Fraction R119-R120 integrated paper and legible strategy
        run: |
          set -euo pipefail
          python3 tools/content-validator/experiments/s2_microcity_attention.py > /tmp/S2-D.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          j=json.load(open('/tmp/S2-D.json'))
          assert j['studies']==['R119','R120']
          case=next(x for x in j['results'] if x['B_reward']=='3/2')
          assert case['optimal']=='2359/729'
          assert F(case['fixed_priority']['gap'])==F(1,6)
          assert F(case['strong_public_rule']['gap'])==0
          assert F(case['added_C_value'])>0
          assert F(case['closure_opportunity_cost'])>0
          print('R119-R120: opportunity causal ablations and simple public strategy validated as paper math; NOT game canon')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssnoir-s2-integrated-microcity
          path: /tmp/S2-D.json
