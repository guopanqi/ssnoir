<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSNoir · 事件单页</title><link rel="icon" href="data:,"><link rel="stylesheet" href="shared/base.css"><link rel="stylesheet" href="shared/lab.css"><link rel="stylesheet" href="event-sheet/layout.css?v=4"></head>
<body><main class="page"><header class="lab-heading"><span>SSNOIR / UI 实验室</span><small>纸张、插画与一次发生的事</small></header><nav class="lab-nav" aria-label="原型实验"><a href="index.html">行动与状态</a><a href="index.html?experiment=dialogue">对话</a><a href="grouping.html">对象与行动编组</a><a href="event-sheet.html" aria-current="page">事件单页</a></nav>
<div class="toolbar"><div class="group" id="samples" aria-label="示例事件"><button data-sample="care" aria-pressed="true">夜莺 · 再次包扎</button><button data-sample="comfort" aria-pressed="false">夜莺 · 逗你笑</button><button data-sample="first" aria-pressed="false">夜莺 · 首次包扎</button><button data-sample="rent" aria-pressed="false">房东 · 房租收据</button><button data-sample="news" aria-pressed="false">今日报纸</button></div><div class="group"><label>分格<select id="panel-layout"><option value="equal">三格等宽</option><option value="final" selected>末格放大</option><option value="detail">中间特写</option><option value="stack">一大格与上下两格</option></select></label><label><input id="image-toggle" type="checkbox" checked> 插画</label><label><input id="typing-toggle" type="checkbox"> 打字效果</label><button id="replay">重新展开</button></div></div>
<div class="viewport" id="sheet-viewport"><section class="sheet-game" id="sheet-game" aria-label="事件单页游戏预览"><div class="world-top"><span>世界 / 旅馆</span><span>第 18 天　　手头的事　　成长</span></div><div class="world-place">旅馆</div><div class="world-node">房间<br><small>一盏留着的灯。</small></div><div class="veil" aria-hidden="true"></div><section class="paper" id="paper" aria-label="分格事件单页"><div class="story-beats" id="story-beats"><div class="illustration" id="illustration"></div><div class="paper-copy" id="body" aria-live="polite"><div id="story-lines"></div><div class="consequence" id="consequence"></div></div></div><footer class="paper-footer"><button id="continue">收起</button></footer></section><section id="dialogue" class="after-dialogue" hidden aria-label="首次事件的后续对白"><span id="speaker"></span><p id="line"></p><button id="next-line">继续</button></section><div id="closed" class="closed" hidden><span>回到旅馆</span><button id="reopen">再次查看单页</button></div></section></div>
<section class="design-note"><div class="phase">事件单页 / 01</div><div><h2 id="note-title">被照顾的片刻，不必每次重演</h2><p id="note-copy">漫画与文字逐格同步显现，前面的格子保留；最后出现效果与关闭按钮。点击图文可提前推进，文字默认即显。插画为墨线分镜示意，不修改正式游戏。</p></div></section></main><script type="module" src="event-sheet/main.js?v=4"></script></body></html>
