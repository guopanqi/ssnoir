<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070c" />
    <title>SSNoir · 剪影夜城 SKYLINE NOIR — by GLM</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #04070c; }
      body { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #c8d3dc; }
      #scene, #scene canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; z-index: 10; letter-spacing: 0.08em; }
      .hud-top { top: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: baseline; pointer-events: none; }
      .eyebrow { font-size: 10px; color: #5d6f7e; }
      .hud-top h1 { margin: 2px 0 0; font-size: 17px; font-weight: 600; color: #e8eef2; letter-spacing: 0.14em; }
      .shot-label { font-size: 12px; color: #8fa3b2; }
      .panel {
        position: fixed; right: 24px; bottom: 44px; z-index: 10; width: 200px;
        background: rgba(8, 12, 18, 0.88); border: 1px solid #24313d; padding: 12px 14px;
      }
      .panel-title { font-size: 10px; color: #5d6f7e; letter-spacing: 0.14em; margin-bottom: 8px; }
      .panel label { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; color: #aebcc7; cursor: pointer; }
      .panel input[type="checkbox"] { accent-color: #c98a3d; }
      .panel-foot { margin-top: 8px; font-size: 10px; color: #4d5d6b; }
      .hud-bottom { left: 24px; bottom: 16px; right: 24px; display: flex; justify-content: space-between; font-size: 10px; color: #4d5d6b; pointer-events: none; }
      body[data-capture] .hud, body[data-capture] .panel { display: none; }
    </style>
  </head>
  <body>
    <div id="scene"></div>

    <header class="hud hud-top">
      <div>
        <div class="eyebrow">SSNOIR / CITY VIEW VISUAL EXPERIMENT — BY GLM</div>
        <h1>剪影夜城 SKYLINE NOIR</h1>
      </div>
      <div class="shot-label" id="shotLabel"></div>
    </header>

    <aside class="panel" id="panel">
      <div class="panel-title">视觉变量</div>
      <label><span>地标墨线</span><input id="ink" type="checkbox" checked /></label>
      <label><span>探照灯</span><input id="beacon" type="checkbox" checked /></label>
      <label><span>街灯与灯池</span><input id="lamps" type="checkbox" checked /></label>
      <label><span>烟</span><input id="smoke" type="checkbox" checked /></label>
      <label><span>雾</span><input id="fog" type="checkbox" checked /></label>
      <label><span>Bloom</span><input id="bloom" type="checkbox" checked /></label>
      <label><span>成片调色</span><input id="grade" type="checkbox" checked /></label>
      <div class="panel-foot">1–4 机位 · Space 暂停 · H 隐藏面板 · 拖动环视 · 滚轮推拉</div>
    </aside>

    <footer class="hud hud-bottom">
      <span>论点：夜城是一张海报 — 建筑是黑纸剪影，光只落在有叙事理由的地方</span>
      <span id="fps"></span>
    </footer>

    <script type="module" src="/src/skyline-noir-glm/main.js"></script>
  </body>
</html>
