<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <title>SSNoir — Noir Engraving Lab</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header class="hud hud-top">
        <div>
          <div class="eyebrow">SSNOIR / VISUAL RESEARCH</div>
          <h1>NOIR ENGRAVING LAB</h1>
        </div>
        <div class="shot-label" id="shotLabel">01 · THEATER STREET</div>
      </header>

      <aside class="panel" id="panel">
        <div class="panel-title">视觉变量</div>
        <label><span>版画涂装</span><input id="stylize" type="checkbox" checked /></label>
        <label><span>几何描线</span><input id="outlines" type="checkbox" checked /></label>
        <label><span>雨</span><input id="atmosphere" type="checkbox" checked /></label>
        <label><span>光束</span><input id="lightCones" type="checkbox" checked /></label>
        <label class="range"><span>色阶</span><input id="levels" type="range" min="3" max="10" step="1" value="6" /><output id="levelsValue">6</output></label>
        <label class="range"><span>Dither</span><input id="dither" type="range" min="0" max="1.25" step="0.05" value="0.85" /><output id="ditherValue">0.85</output></label>
        <label class="range"><span>雾</span><input id="fog" type="range" min="0" max="0.06" step="0.002" value="0.024" /><output id="fogValue">0.024</output></label>
        <label class="range"><span>Bloom</span><input id="bloom" type="range" min="0" max="1.5" step="0.05" value="0.65" /><output id="bloomValue">0.65</output></label>
        <div class="panel-foot">1–4 切换机位 · Space 暂停雨 · H 隐藏面板</div>
      </aside>

      <footer class="hud hud-bottom">
        <span>研究目标：少细节 · 强轮廓 · 选择性线条 · 戏剧性光 · 可程序化生产</span>
        <span id="fps">-- fps</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
