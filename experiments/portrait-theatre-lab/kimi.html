<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立绘剧场 · Portrait Theatre — kimi</title>
<style>
:root{--gold:#c9a86a;--ink:#e8e2d4;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#07080b;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 18px;background:#0d0f14;border-bottom:1px solid #232833;}
header h1{font-size:16px;margin:0;letter-spacing:2px;color:var(--gold);font-weight:600;}
header .sub{font-size:12px;color:#6b7382;letter-spacing:1px;}
.ctr{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.btn{cursor:pointer;background:#141821;color:#cfd6e4;border:1px solid #2c3342;
  border-radius:4px;padding:5px 13px;font-size:13px;font-family:inherit;letter-spacing:1px;
  transition:all .2s;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.on{border-color:var(--gold);color:var(--gold);background:#1c1a12;}
.tabs{display:flex;gap:6px;}
.tab{cursor:pointer;font-size:12px;color:#8a93a5;border:1px solid #262c3a;border-radius:4px;
  padding:4px 9px;background:#10131b;font-family:inherit;transition:all .2s;}
.tab:hover{color:#d5dbe8;}
.tab.on{color:var(--gold);border-color:var(--gold);background:#1d1a11;}
#stage{position:relative;width:min(1120px,96vw);aspect-ratio:16/9;margin:16px auto 8px;
  background:#000;overflow:hidden;border:1px solid #2a2f3a;border-radius:6px;
  box-shadow:0 24px 70px rgba(0,0,0,.65);}
#stage.shake{animation:shk .55s;}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}
  40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#bg{position:absolute;inset:0;transition:background 1.2s;}
#bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:14%;
  background:linear-gradient(transparent,rgba(255,255,255,.05));}
#vig{position:absolute;inset:0;pointer-events:none;z-index:20;
  background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.52) 100%);}
#shade{position:absolute;inset:0;pointer-events:none;z-index:21;opacity:0;transition:opacity 1s;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,45%),transparent 0 13%,rgba(2,4,8,.8) 46%);}
#warm{position:absolute;inset:0;pointer-events:none;z-index:21;opacity:0;transition:opacity 2.2s;
  background:radial-gradient(ellipse at 50% 18%,rgba(255,190,110,.30),transparent 62%);}
#warm.on{opacity:1;}
#flash{position:absolute;inset:0;pointer-events:none;z-index:40;background:#dfe8ff;opacity:0;}
#flash.go{animation:fl .55s;}
@keyframes fl{0%{opacity:0}12%{opacity:.85}30%{opacity:.08}45%{opacity:.5}100%{opacity:0}}
#fade{position:absolute;inset:0;pointer-events:none;z-index:60;background:#000;opacity:1;
  transition:opacity .9s;}
#rain{position:absolute;inset:0;z-index:6;pointer-events:none;}
/* ---------- props ---------- */
.prop{position:absolute;display:none;}
.prop.on{display:block;}
#door1Wrap{right:6%;bottom:9%;width:13%;height:62%;perspective:800px;z-index:9;}
.doorLight{position:absolute;inset:-14% -40%;opacity:0;transition:opacity 1.5s .35s;
  background:radial-gradient(ellipse at center,rgba(255,198,112,.9),rgba(255,170,80,.14) 55%,transparent 78%);}
.doorLight.on{opacity:1;}
.door1{position:absolute;inset:0;background:#263043;border:4px solid #0e1420;
  transform-origin:right center;transition:transform 1.35s ease .3s;
  box-shadow:inset 0 0 40px rgba(0,0,0,.55);}
.door1.open{transform:rotateY(-108deg);}
.dpanel{position:absolute;left:14%;right:14%;height:30%;border:2px solid #141b28;
  box-shadow:inset 0 5px 12px rgba(0,0,0,.55);}
.dpanel.p1{top:12%;}.dpanel.p2{bottom:12%;}
.knob{position:absolute;right:7%;top:50%;width:9px;height:9px;border-radius:50%;background:#c9a86a;
  box-shadow:0 0 4px #000;}
#panel301{right:21%;top:32%;width:44px;z-index:9;text-align:center;}
.plateNum{background:#c9ccd4;color:#1b1e26;font-size:13px;font-weight:700;border-radius:3px;
  padding:2px 0;font-family:monospace;letter-spacing:2px;box-shadow:0 1px 3px #000;}
.btnDotWrap{margin-top:8px;display:inline-block;background:#232b3a;border:2px solid #10151f;
  border-radius:6px;padding:5px;}
.btnDot{width:10px;height:10px;border-radius:50%;background:#8a2f35;transition:all .2s;}
.btnDot.glow{background:#e05050;box-shadow:0 0 12px #e05050;}
#pack{width:7%;z-index:11;opacity:0;transform:rotate(-10deg) scale(.5);
  transition:opacity .8s,transform .8s;}
#pack.on{opacity:1;transform:rotate(-10deg) scale(1);}
#pack svg{width:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
#hatProp{left:11%;bottom:31%;width:7.5%;z-index:8;}
#hatProp svg{width:100%;display:block;}
#umbProp{left:4.5%;bottom:9%;width:3.6%;z-index:8;transform:rotate(14deg);transform-origin:bottom center;}
#umbProp svg{width:100%;display:block;}
#phoneWrap{right:6%;bottom:9%;width:23%;z-index:8;}
#phoneWrap svg{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));}
#tdoor{right:25%;bottom:9%;width:21%;height:76%;z-index:8;display:none;}
#tdoor.on{display:flex;}
#tdoor .tp{flex:1;background:#3a1f24;border:3px solid #18090c;position:relative;
  box-shadow:inset 0 0 30px rgba(0,0,0,.5);}
#tdoor .tp::after{content:'';position:absolute;left:50%;top:24%;width:34%;aspect-ratio:1;
  transform:translateX(-50%);border-radius:50%;background:#d9c9a0;
  box-shadow:inset 0 0 0 4px #241014,0 0 14px rgba(0,0,0,.6);}
#tdoor.slam{animation:slm .6s ease-out;transform-origin:center;}
@keyframes slm{0%{transform:scaleX(1)}25%{transform:scaleX(.78)}50%{transform:scaleX(1.07)}
  75%{transform:scaleX(.96)}100%{transform:scaleX(1)}}
.tear{position:absolute;width:5px;height:9px;border-radius:50% 50% 62% 62%;z-index:12;opacity:0;
  background:linear-gradient(#cfe6ff,#7fb0e8);}
.tear.fall{animation:tfall 1.9s ease-in infinite;}
@keyframes tfall{0%{opacity:0;transform:translateY(0)}15%{opacity:.95}100%{opacity:0;transform:translateY(52px)}}
.patHand{position:absolute;width:24px;height:19px;background:#f0c8a0;border-radius:50%;z-index:13;
  opacity:0;transition:opacity .5s;box-shadow:0 2px 4px rgba(0,0,0,.4);}
.patHand.on{opacity:1;}
/* ---------- actors ---------- */
#actors{position:absolute;inset:0;z-index:10;pointer-events:none;}
.actor{position:absolute;bottom:9%;width:19%;transition:left 1.35s cubic-bezier(.5,.05,.35,1),opacity .8s;}
.actor::after{content:'';position:absolute;bottom:-4px;left:12%;right:12%;height:18px;z-index:-1;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);}
.actor svg{width:100%;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));}
.actor.small{width:12.5%;}
.inner{transition:transform .3s;}
.inner.flip{transform:scaleX(-1);}
.tag{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:12px;color:#cfd6e4;
  background:rgba(10,12,18,.6);padding:2px 11px;border:1px solid #333a48;border-radius:11px;
  white-space:nowrap;letter-spacing:2px;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.actor.speaking svg{animation:bob 1.15s ease-in-out infinite;}
@keyframes patbob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.actor.patted svg{animation:patbob .45s ease-in-out 4;}
/* svg layer visibility */
.c .arms{display:none;}
.c .arms-idle{display:inline;}
.c.pose-talkA .arms-idle{display:none;}.c.pose-talkA .arms-talk{display:inline;}
.c.pose-thinkA .arms-idle{display:none;}.c.pose-thinkA .arms-think{display:inline;}
.c.pose-pointA .arms-idle{display:none;}.c.pose-pointA .arms-point{display:inline;}
.c.pose-crossA .arms-idle{display:none;}.c.pose-crossA .arms-cross{display:inline;}
.c.pose-claspA .arms-idle{display:none;}.c.pose-claspA .arms-clasp{display:inline;}
.c.pose-pleadA .arms-idle{display:none;}.c.pose-pleadA .arms-plead{display:inline;}
.c.pose-holdA .arms-idle{display:none;}.c.pose-holdA .arms-hold{display:inline;}
.c.pose-spreadA .arms-idle{display:none;}.c.pose-spreadA .arms-spread{display:inline;}
.c.pose-patA .arms-idle{display:none;}.c.pose-patA .arms-pat{display:inline;}
.c .face{display:none;}
.c .face-calm{display:inline;}
.c.pose-sternF .face-calm{display:none;}.c.pose-sternF .face-stern{display:inline;}
.c.pose-openF .face-calm{display:none;}.c.pose-openF .face-open{display:inline;}
.c.pose-tiredF .face-calm{display:none;}.c.pose-tiredF .face-tired{display:inline;}
.c.pose-sadF .face-calm{display:none;}.c.pose-sadF .face-sad{display:inline;}
.c.pose-cryF .face-calm{display:none;}.c.pose-cryF .face-cry{display:inline;}
.c .acc-hat,.c .acc-umb{display:none;}
.c.acc-hat .acc-hat{display:inline;}
.c.acc-umb .acc-umb{display:inline;}
.c .head{transition:transform .8s ease;transform-box:view-box;transform-origin:100px 120px;}
.c.head-down .head{transform:rotate(6deg) translate(0,8px);}
.c .w-arm{transform-box:fill-box;transform-origin:18% 88%;}
.actor.working .w-arm{animation:wkr 1.1s ease-in-out infinite;}
@keyframes wkr{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}
/* ---------- dialogue ---------- */
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:30;min-height:92px;
  background:linear-gradient(transparent,rgba(4,5,9,.9) 34%);
  padding:30px 38px 20px;display:flex;gap:16px;align-items:baseline;}
#chip{flex:none;font-size:14px;padding:3px 14px;border-radius:4px;letter-spacing:2px;
  border:1px solid var(--gold);color:var(--gold);align-self:flex-start;}
#chip.off{opacity:.6;border-color:#5a6478;color:#8a94a8;}
#txt{font-size:clamp(15px,1.85vw,21px);line-height:1.6;text-shadow:0 2px 8px #000;margin:0;}
#txt.dir{font-style:italic;color:#98a1b3;font-size:clamp(13px,1.6vw,18px);
  text-align:center;margin:0 auto;letter-spacing:1px;}
#sceneTitle{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s;}
#sceneTitle.show{opacity:1;}
#sceneTitle .t1{font-size:clamp(20px,3vw,34px);letter-spacing:10px;color:var(--gold);
  text-shadow:0 4px 20px #000;}
#sceneTitle .t2{font-size:13px;letter-spacing:5px;color:#8a93a5;}
#prog{width:min(1120px,96vw);margin:4px auto 0;height:3px;background:#1b1f2a;border-radius:2px;overflow:hidden;}
#progF{height:100%;width:0;background:linear-gradient(90deg,#8a6f3c,var(--gold));transition:width .3s linear;}
footer{width:min(1120px,96vw);margin:8px auto 26px;font-size:12px;color:#555e6e;display:flex;
  justify-content:space-between;letter-spacing:1px;}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,5,8,.92);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  transition:opacity .8s;}
.overlay.hide{opacity:0;pointer-events:none;}
.overlay h2{font-size:clamp(24px,4vw,42px);letter-spacing:14px;color:var(--gold);margin:0;font-weight:600;}
.overlay p{color:#8a93a5;font-size:14px;letter-spacing:2px;margin:0;line-height:2;}
.bigBtn{cursor:pointer;font-family:inherit;font-size:17px;letter-spacing:6px;color:#1a1508;
  background:linear-gradient(180deg,#e2c384,#b8934f);border:none;border-radius:6px;
  padding:13px 46px;box-shadow:0 6px 24px rgba(201,168,106,.25);transition:transform .2s;}
.bigBtn:hover{transform:translateY(-2px);}
#endcard h2{letter-spacing:20px;}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s);
const STAGE=$('#stage');

/* ================= AUDIO ================= */
let ACtx=null,master=null,noiseBuf=null,rainG=null;
function ensureAudio(){
  if(ACtx){if(ACtx.state==='suspended')ACtx.resume();return;}
  ACtx=new (window.AudioContext||window.webkitAudioContext)();
  master=ACtx.createGain();master.gain.value=.9;master.connect(ACtx.destination);
  noiseBuf=ACtx.createBuffer(1,ACtx.sampleRate*2,ACtx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(g,t,a,peak,dec){
  g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
}
function blip(freq,dur,type,peak){
  if(!ACtx)return;const t=ACtx.currentTime;
  const o=ACtx.createOscillator();o.type=type||'square';o.frequency.value=freq;
  const g=ACtx.createGain();env(g,t,.008,peak||.2,dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.15);
}
function noiseHit(freq,dur,peak){
  if(!ACtx)return;const t=ACtx.currentTime;
  const s=ACtx.createBufferSource();s.buffer=noiseBuf;
  const f=ACtx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=ACtx.createGain();env(g,t,.006,peak,dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.2);
}
function thump(){
  if(!ACtx)return;const t=ACtx.currentTime;
  const o=ACtx.createOscillator();o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(42,t+.28);
  const g=ACtx.createGain();env(g,t,.006,.5,.32);
  o.connect(g).connect(master);o.start(t);o.stop(t+.5);
  noiseHit(300,.14,.3);
}
const SFX={
  buzzer(){blip(185,.14,'square',.22);setTimeout(()=>blip(185,.14,'square',.22),230);},
  unlock(){noiseHit(1400,.05,.18);setTimeout(()=>{blip(92,.1,'sine',.3);noiseHit(220,.12,.22);},130);},
  slam(){noiseHit(420,.3,.6);thump();setTimeout(()=>noiseHit(150,.25,.3),90);},
  thunder(){noiseHit(110,1.7,.32);},
  whoosh(){if(!ACtx)return;const t=ACtx.currentTime;
    const s=ACtx.createBufferSource();s.buffer=noiseBuf;
    const f=ACtx.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(320,t);f.frequency.exponentialRampToValueAtTime(1500,t+.5);
    const g=ACtx.createGain();env(g,t,.14,.16,.5);
    s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+.9);},
  sting(){if(!ACtx)return;[220,261.63,329.63].forEach(fr=>{

/* pose maps: a=arms class, f=face class, hd=head down, hat, umb, flip */
const POSES={
 neil:{idle:{a:'idle',f:'calm'},talk:{a:'talk',f:'open'},think:{a:'think',f:'tired'},
   point:{a:'point',f:'stern'},cross:{a:'cross',f:'stern'},stiff:{a:'idle',f:'stern'}},
 yy:{idle:{a:'idle',f:'calm'},talk:{a:'idle',f:'open'},nervous:{a:'clasp',f:'sad'},
   clasp:{a:'clasp',f:'sad'},plead:{a:'plead',f:'sad'},point:{a:'point',f:'stern'},
   firm:{a:'idle',f:'stern'},turn:{a:'idle',f:'sad',flip:1},down:{a:'clasp',f:'sad',hd:1},
   cry:{a:'clasp',f:'cry',hd:1},stare:{a:'clasp',f:'calm'},
   umbrella:{a:'hold',f:'calm',umb:1},hat:{a:'idle',f:'calm',hat:1},
   hatUmb:{a:'hold',f:'calm',hat:1,umb:1}},
 mgr:{idle:{a:'idle',f:'calm'},talk:{a:'talk',f:'open'},spread:{a:'spread',f:'open'},
   point:{a:'point',f:'stern'},stern:{a:'idle',f:'stern'},pat:{a:'pat',f:'calm'}},
 worker:{idle:{}}
};
const NAMES={yy:'夜莺',neil:'尼尔',mgr:'经理',worker:'工人'};
const CHIP_COLOR={yy:'#7fc7be',neil:'#c9a86a',mgr:'#d08a8a',worker:'#9aa3b5'};
const ACTORS={};
['neil','yy','mgr','worker'].forEach(k=>{
  ACTORS[k]={el:$('#a-'+k),inner:$('#i-'+k),svg:$('#i-'+k).querySelector('svg'),
    x:120,pose:'idle',flip:false,hide:false};
});
function applyPose(k,poseName){
  const A=ACTORS[k],p=(POSES[k]&&POSES[k][poseName])||{a:'idle',f:'calm'};
  A.pose=poseName;
  let cls='c '+k+' arms-'+(p.a||'idle')+' face-'+(p.f||'calm');
  if(p.hd)cls+=' head-down';
  if(p.hat)cls+=' acc-hat';
  if(p.umb)cls+=' acc-umb';
  A.svg.setAttribute('class',cls);
  A.flip=!!p.flip;
  A.inner.classList.toggle('flip',A.flip);
}
function applyX(k){
  const A=ACTORS[k];
  A.el.style.left=A.x+'%';
  A.el.style.opacity=(A.hide||A.x<-12||A.x>112)?0:1;
}
function cast(cfg){
  ['neil','yy','mgr','worker'].forEach(k=>{
    const c=cfg[k]||{hide:true};
    ACTORS[k].hide=!!c.hide;
    ACTORS[k].x=(c.x!==undefined)?c.x:120;
    applyPose(k,c.pose||'idle');
    applyX(k);
  });
}
function stepCast(st){
  ['neil','yy','mgr','worker'].forEach(k=>{
    if(!st[k])return;
    const A=ACTORS[k],c=st[k];
    if(c.pose)applyPose(k,c.pose);
    if(c.x!==undefined){A.x=c.x;applyX(k);}
  });
}

/* ================= ENGINE ================= */
let sceneIdx=0,stepIdx=0,mode='intro',speed=1;
let stepTimer=null,typeTimer=null,stepEndAt=0,remaining=0,typeIv=0;
let typedLen=0,curText='';
const TOTAL=SCENES.reduce((n,s)=>n+s.steps.length,0);
let doneBefore=0;
const dlg=$('#dlg'),chipEl=$('#chip'),txtEl=$('#txt');

function calcDur(st){
  if(st.hold)return st.hold;
  if(st.d)return st.d;
  if(st.dir)return 2800;
  return Math.min(8400,Math.max(2200,1500+st.text.length*88));
}
function showDir(text){
  chipEl.style.visibility='hidden';
  txtEl.className='dir';
  txtEl.textContent=text;
}
function showLine(st){
  chipEl.style.visibility='visible';
  chipEl.textContent=(st.off?'☎ ':'')+NAMES[st.who];
  chipEl.className=st.off?'off':'';
  chipEl.style.borderColor=CHIP_COLOR[st.who];
  chipEl.style.color=st.off?'#8a94a8':CHIP_COLOR[st.who];
  txtEl.className='';
  txtEl.textContent='';
  curText=st.text;typedLen=0;
  typeIv=Math.max(24,(calcDur(st)*speed*.8)/curText.length);
  clearTimeout(typeTimer);
  typeNext();
  Object.keys(ACTORS).forEach(k=>ACTORS[k].el.classList.toggle('speaking',k===st.who&&!ACTORS[k].hide));
}
function typeNext(){
  if(typedLen<curText.length){
    typedLen++;
    txtEl.textContent=curText.slice(0,typedLen);
    typeTimer=setTimeout(typeNext,typeIv);
  }
}
function finishTyping(){typedLen=curText.length;txtEl.textContent=curText;}

/* --- FX --- */
function shadeOn(x,y){const s=$('#shade');s.style.setProperty('--fx',x+'%');s.style.setProperty('--fy',y+'%');s.style.opacity=1;}
function shadeOff(){$('#shade').style.opacity=0;}
function tearsOn(){
  const A=ACTORS.yy;
  ['tear1','tear2','tear3'].forEach((id,i)=>{
    const t=$('#'+id);
    t.style.left=(A.x+(A.flip?-1:1)*(2+i*1.6))+'%';
    t.style.top=(33+i*2)+'%';
    t.style.animationDelay=(i*.5)+'s';
    t.classList.add('fall');
  });
}
function tearsOff(){['tear1','tear2','tear3'].forEach(id=>$('#'+id).classList.remove('fall'));}
const FX={
  buzzer(){SFX.buzzer();const b=$('#btnDot');b.classList.add('glow');setTimeout(()=>b.classList.remove('glow'),900);},
  walk1(){},
  whoosh(){SFX.whoosh();},
  doorOpen(){SFX.unlock();$('#door1').classList.add('open');$('#doorLight').classList.add('on');},
  pack(){const p=$('#pack'),n=ACTORS.neil.x;

  spotPack(){const p=$('#pack');shadeOn(parseFloat(p.style.left)+3,52);},
  tension(){const n=ACTORS.neil.x;shadeOn(n,42);SFX.thunder&&0;},
  tension2(){const n=ACTORS.neil.x;shadeOn(n,42);},
  tears(){tearsOn();},
  dressUp(){SFX.rustle();$('#hatProp').classList.remove('on');$('#umbProp').classList.remove('on');},

  exitBoth(){const yy=ACTORS.yy,nl=ACTORS.neil;
    yy.x=-14;applyX(yy);

    setTimeout(()=>{ $('#tdoor').classList.add('slam');STAGE.classList.add('shake');
      SFX.slam();$('#warm').classList.remove('on');
      setTimeout(()=>{STAGE.classList.remove('shake');$('#tdoor').classList.remove('slam');},800);
    },2100);}
};

/* --- rain --- */
const canvas=$('#rain'),rc=canvas.getContext('2d');
let drops=[];
function rainResize(){canvas.width=STAGE.clientWidth;canvas.height=STAGE.clientHeight;
  drops=Array.from({length:130},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    l:10+Math.random()*16,v:5+Math.random()*7}));}
window.addEventListener('resize',rainResize);
function rainLoop(){
  requestAnimationFrame(rainLoop);
  const scene=SCENES[sceneIdx];
  rc.clearRect(0,0,canvas.width,canvas.height);
  if(!scene||!scene.rain)return;
  rc.strokeStyle='rgba(178,200,240,.32)';rc.lineWidth=1.1;rc.beginPath();
  drops.forEach(d=>{rc.moveTo(d.x,d.y);rc.lineTo(d.x-2,d.y+d.l);
    d.y+=d.v;d.x-=1;if(d.y>canvas.height){d.y=-20;d.x=Math.random()*(canvas.width+40);}});
  rc.stroke();
}
/* --- lightning --- */
let boltTimer=null;
function scheduleBolt(){
  clearTimeout(boltTimer);
  boltTimer=setTimeout(()=>{
    const scene=SCENES[sceneIdx];
    if(scene&&scene.lightning&&mode==='playing'){
      const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
      setTimeout(()=>SFX.thunder(),380);
    }
    scheduleBolt();
  },5500+Math.random()*8000);
}

/* --- scene control --- */
function setProps(list){
  document.querySelectorAll('.prop').forEach(p=>p.classList.toggle('on',list.includes(p.id)));
}
function sceneTitle(t,s){
  $('#stT').textContent=t;$('#stS').textContent=s;
  const el=$('#sceneTitle');el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2300);
}
function applyScene(idx){
  sceneIdx=idx;
  const sc=SCENES[idx];
  $('#bg').style.background=sc.bg;
  setProps(sc.props||[]);
  cast(sc.cast);
  doneBefore=SCENES.slice(0,idx).reduce((n,s)=>n+s.steps.length,0);
  tearsOff();shadeOff();
  $('#warm').classList.remove('on');
  $('#a-worker').classList.remove('working');
  $('#patHand').classList.remove('on');
  $('#door1').classList.remove('open');
  $('#doorLight').classList.remove('on');
  $('#pack').classList.remove('on');
  $('#tdoor').classList.remove('slam');
  if(sc.rain)rainStart();else rainStop();
  sceneTitle(sc.t,sc.s);
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===idx));
  if(sc.enterFx==='working')$('#a-worker').classList.add('working');
}
let pendingStep=0;
function goScene(idx,auto,startAt){
  clearTimeout(stepTimer);clearTimeout(typeTimer);
  pendingStep=startAt||0;
  $('#fade').style.opacity=1;
  setTimeout(()=>{
    applyScene(idx);
    stepIdx=pendingStep;
    $('#fade').style.opacity=0;
    if(auto&&mode!=='playing')return;
    runStep();
  },700);
}
function runStep(){
  clearTimeout(stepTimer);clearTimeout(typeTimer);
  const sc=SCENES[sceneIdx];
  if(stepIdx>=sc.steps.length){
    if(sceneIdx<SCENES.length-1){goScene(sceneIdx+1,true);}
    else{endShow();}
    return;
  }
  const st=sc.steps[stepIdx];
  stepCast(st);
  if(st.dir)showDir(st.dir);else showLine(st);
  const fx=st.fx?(Array.isArray(st.fx)?st.fx:[st.fx]):[];
  fx.forEach(f=>FX[f]&&FX[f]());
  const dur=calcDur(st)*speed;
  stepEndAt=performance.now()+dur;
  stepTimer=setTimeout(()=>{stepIdx++;runStep();},dur);
  updateProg();
}
function updateProg(){
  const sc=SCENES[sceneIdx];
  const cur=Math.min(stepIdx,sc.steps.length-1);
  let frac=0;
  if(mode==='playing'&&stepTimer){
    frac=1-Math.max(0,stepEndAt-performance.now())/(calcDur(sc.steps[cur])*speed);
  }
  const done=doneBefore+cur+Math.min(1,Math.max(0,frac));
  $('#progF').style.width=(done/TOTAL*100)+'%';
}
setInterval(updateProg,180);

function endShow(){
  mode='ended';
  clearTimeout(stepTimer);clearTimeout(typeTimer);
  Object.keys(ACTORS).forEach(k=>ACTORS[k].el.classList.remove('speaking'));
  $('#fade').style.opacity=1;
  setTimeout(()=>{$('#endcard').classList.remove('hide');},900);
}

/* --- transport --- */
function play(){
  ensureAudio();
  if(mode==='ended'){ $('#endcard').classList.add('hide');goScene(0,true);mode='playing';setBtn();return;}
  if(mode==='intro'){$('#intro').classList.add('hide');mode='playing';goScene(0,true);setBtn();return;}
  if(mode==='playing'){ /* pause */
    mode='paused';
    clearTimeout(stepTimer);clearTimeout(typeTimer);
    remaining=Math.max(300,stepEndAt-performance.now());
    finishTyping();
    if(rainG&&ACtx)rainG.gain.linearRampToValueAtTime(.02,ACtx.currentTime+.4);
    setBtn();return;
  }
  /* resume */
  mode='playing';
  const sc=SCENES[sceneIdx],st=sc.steps[stepIdx];
  if(st&&!st.dir&&curText){
    const left=curText.length-typedLen;
    if(left>0){typeIv=Math.max(18,(remaining*.75)/left);typeNext();}
  }
  stepEndAt=performance.now()+remaining;
  stepTimer=setTimeout(()=>{stepIdx++;runStep();},remaining);
  if(rainG&&ACtx&&SCENES[sceneIdx].rain)rainG.gain.linearRampToValueAtTime(.11,ACtx.currentTime+.6);
  setBtn();
}
function replay(){
  ensureAudio();
  $('#endcard').classList.add('hide');
  mode='playing';
  goScene(0,true);
  setBtn();
}
function jumpScene(i){
  ensureAudio();
  if(mode==='intro'){$('#intro').classList.add('hide');mode='playing';}
  if(mode==='ended'){$('#endcard').classList.add('hide');mode='playing';}
  goScene(i,true);
  setBtn();
}
function nextStep(){if(mode!=='playing')return;clearTimeout(stepTimer);finishTyping();stepIdx++;runStep();}
function prevStep(){
  if(mode!=='playing')return;
  clearTimeout(stepTimer);clearTimeout(typeTimer);
  if(stepIdx>0){stepIdx--;runStep();}
  else if(sceneIdx>0){goScene(sceneIdx-1,true,SCENES[sceneIdx-1].steps.length-1);}
  return;
}
function setBtn(){
  const b=$('#bPlay');
  if(mode==='playing'){b.textContent='⏸ 暂停';b.classList.add('on');}
  else if(mode==='paused'){b.textContent='▶ 继续';b.classList.remove('on');}
  else{b.textContent='▶ 开始';b.classList.remove('on');}
}
$('#bPlay').onclick=play;
$('#bReplay').onclick=replay;
$('#bStart').onclick=play;
$('#bAgain').onclick=replay;
$('#bSpeed').onclick=()=>{speed=(speed===1)?1.5:1;$('#bSpeed').textContent=speed+'×';};
const tabsEl=$('#tabs');
SCENES.forEach((sc,i)=>{
  const b=document.createElement('button');
  b.className='tab';b.textContent='幕'+'一二三四五六'[i];
  b.title=sc.t+' '+sc.s.replace(/\s/g,'');
  b.onclick=()=>jumpScene(i);
  tabsEl.appendChild(b);
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();play();}
  else if(e.key==='r'||e.key==='R'){replay();}
  else if(e.key==='ArrowRight'){nextStep();}
  else if(e.key==='ArrowLeft'){prevStep();}
});

/* init */
rainResize();
rainLoop();
scheduleBolt();
applyScene(0);
mode='intro';
setBtn();
</script>
</body>
</html>
