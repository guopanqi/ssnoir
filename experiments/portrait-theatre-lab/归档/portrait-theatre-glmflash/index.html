<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>立绘剧场 · Portrait Theatre — GLM</title>
<style>
:root{ --gold:#c8a25a; --ink:#e8e2d6; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0b10;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC",STSong,Georgia,serif;
  display:flex;align-items:center;justify-content:center}
#app{width:min(1180px,96vw)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 6px 8px}
.brand{font-size:20px;letter-spacing:3px}
.brand span{color:var(--gold);font-size:12px;letter-spacing:4px;margin-left:10px}
.meta{color:#6f6a60;font-size:12px;letter-spacing:2px}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#5a1420;color:#ffd9d9;
  padding:8px 14px;font-size:13px;font-family:Consolas,monospace}
#stage-wrap{position:relative;border:1px solid #26241f;border-radius:6px;overflow:hidden;
  background:#000;box-shadow:0 24px 70px rgba(0,0,0,.65);cursor:pointer;user-select:none}
#stage-wrap.shaking{animation:shake .5s}
@keyframes shake{0%{transform:translate(0,0)}18%{transform:translate(-8px,4px)}
 38%{transform:translate(7px,-5px)}58%{transform:translate(-5px,3px)}
 78%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
#stage{display:block;width:100%;height:auto}
#stage-wrap.paused #stage *{animation-play-state:paused!important}
#stage-wrap.paused #stage{filter:brightness(.85)}
#blackout{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .55s;text-align:center}
#blackout.on{opacity:1}
#card .no{color:var(--gold);font-size:13px;letter-spacing:6px;display:block;margin-bottom:12px}
#card h2{font-size:34px;letter-spacing:10px;margin:0 0 12px;font-weight:600}
#card p{color:#8d877c;font-size:14px;letter-spacing:3px;margin:0}
#poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .3s;pointer-events:none}
#poster.off{opacity:0}
#poster h1{font-size:46px;letter-spacing:16px;margin:0;text-shadow:0 4px 30px #000}
#poster .en{letter-spacing:7px;color:var(--gold);font-size:15px;margin-top:10px}
#poster .tip{margin-top:32px;color:#9a9488;font-size:13px;letter-spacing:4px}
#subtitle{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;width:86%;text-align:center;pointer-events:none}
#subtitle .line{background:linear-gradient(transparent,rgba(0,0,0,.6));padding:18px 12px 8px;
  font-size:clamp(14px,2.2vw,21px);letter-spacing:1px;min-height:1.7em;text-shadow:0 2px 8px #000}
#subSpeaker{font-weight:700;margin-right:12px}
#subSpeaker:empty{display:none}
#subtitle.aside #subText{font-style:italic;color:#a59f93}
footer{display:flex;gap:8px;align-items:center;padding:12px 4px;flex-wrap:wrap}
button{background:#17161a;border:1px solid #34302a;color:#d8d2c4;padding:8px 16px;border-radius:4px;
  cursor:pointer;font-size:13px;letter-spacing:2px;font-family:inherit;transition:.2s}
button:hover{border-color:var(--gold);color:var(--gold)}
#playBtn{min-width:120px}
#playBtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{border-color:#34302a}50%{border-color:var(--gold);color:var(--gold)}}
.chip{padding:6px 11px;font-size:12px}
.chip.cur{border-color:var(--gold);color:var(--gold);background:#1d1a14}
.sp{flex:1}
#stat{color:#7a756a;font-size:12px;letter-spacing:1px}
.headg{transform-box:fill-box;transform-origin:50% 88%}
.bobber{transform-box:fill-box;transform-origin:50% 100%}
.actor{transition:opacity .7s}
.actor.talking .headg{animation:headtalk .8s ease-in-out infinite alternate}
@keyframes headtalk{from{transform:rotate(-1.4deg)}to{transform:rotate(1.8deg)}}
.actor.walking .bobber{animation:bob .46s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(.5deg)}to{transform:translateY(-6px) rotate(-.5deg)}}
.actor .mo{opacity:0}
.actor .mc{opacity:1}
.actor.talking .mo{animation:chomp .34s ease-in-out infinite alternate}
.actor.talking .mc{animation:chompC .34s ease-in-out infinite alternate}
@keyframes chomp{from{opacity:0}to{opacity:1}}
@keyframes chompC{from{opacity:1}to{opacity:0}}
.tear{animation:tear 1.6s ease-in infinite}
@keyframes tear{0%{transform:translate(0,-2px);opacity:0}12%{opacity:1}75%{opacity:.9}100%{transform:translate(4px,54px);opacity:0}}
.spot{transition:opacity .8s}
#s1-winin,#s1-sil{transition:opacity .45s}
#s1-leaf,#s6-leaf{transform-box:fill-box;transform-origin:0% 50%;transition:transform .5s ease-in}
#s1-hall,#s6-hall{transition:opacity .5s}
#s1-btn.flash{fill:#e05548;filter:drop-shadow(0 0 7px #e05548)}
#s4-case,#s4-hat,#s4-umb{transition:opacity .45s}
#prop-box{transition:opacity .6s}
#prop-box-in{transition:transform .65s ease-out;transform-box:fill-box;transform-origin:50% 50%}
#dim{transition:opacity 1s}
#fx-rain{transition:opacity 1.2s}
@keyframes rainfall{from{transform:translateY(0)}to{transform:translateY(860px)}}
</style>
</head>
<body>
<div id="err"></div>
<script>
/* 错误监视：任何脚本错误都会显示在页面顶部红条里 */
window.addEventListener('error',function(e){
  var b=document.getElementById('err');
  if(b){b.style.display='block';
    b.textContent='⚠ 脚本错误：'+(e.message||e.type)+(e.lineno?('（第 '+e.lineno+' 行）'):'')+' —— 请确认文件保存完整后刷新';}
});
window.addEventListener('unhandledrejection',function(e){
  if(e.reason&&typeof e.reason==='symbol')return;
  var b=document.getElementById('err');
  if(b){b.style.display='block';
    b.textContent='⚠ 运行错误：'+(e.reason&&e.reason.message?e.reason.message:e.reason);}
});
</script>

    if(!Ctx)return;

    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);

    const dg=AC.createGain(); dg.gain.value=.045; dg.connect(master);
    [[55,.5],[82.5,.3],[110.3,.16]].forEach(function(p){
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=p[0];
      const g=AC.createGain(); g.gain.value=p[1]; o.connect(g); g.connect(dg); o.start();
    });
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=.4;
    rainG=AC.createGain(); rainG.gain.value=0;
    src.connect(lp); lp.connect(rainG); rainG.connect(master); src.start();
  }catch(e){ AC=null; }
}

  if(!AC)return;
  const os=AC.createOscillator(),gn=AC.createGain(),t0=AC.currentTime+(o.t||0),dur=o.dur||.3;

  gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);

}

  if(!AC)return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter(); fl.type=o.type||'lowpass'; fl.frequency.value=o.f||800;
  const gn=AC.createGain(),t0=AC.currentTime+(o.t||0),dur=o.dur||.08;
  gn.gain.setValueAtTime(o.g||.2,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl); fl.connect(gn); gn.connect(master); s.start(t0); s.stop(t0+dur+.1);
}

  return new Promise(function(res,rej){
    let left=ms;
    const id=setInterval(function(){
      if(g!==player.gen){ clearInterval(id); rej(STOP); return; }
      if(player.paused)return;
      left-=30;
      if(left<=0){ clearInterval(id); res(); }
    },30);
  });
}
function walk(k,x,dur){
  const a=A[k], g=player.gen, x0=a.x;
  a.root.classList.add('walking');
  return new Promise(function(res,rej){
    let t=0,acc=999,last=performance.now();
    function fr(now){
      if(g!==player.gen){ a.root.classList.remove('walking'); rej(STOP); return; }
      const dt=now-last; last=now;
      if(!player.paused){
        t+=dt; acc+=dt;
        if(acc>380){ acc=0; sfx.step(); }
        const r=Math.min(1,t/dur), cx=x0+(x-x0)*r;
        a.x=cx; a.root.style.transform='translate('+cx+'px,645px) scale('+a.scale+')';
        if(r>=1){ a.root.classList.remove('walking'); res(); return; }
      }
      requestAnimationFrame(fr);
    }
    requestAnimationFrame(fr);
  });
}
async function enter(k,x,opts){
  const o=opts||{};
  place(k,o.from===undefined?-140:o.from); faceDir(k,1); setPose(k,o.pose||'idle');

  show(k,true); await wait(80); await walk(k,x,o.dur||1800);
}
function stand(k,x,f,pose){ place(k,x); faceDir(k,f); setPose(k,pose||'idle'); show(k,true); }
function focus(k){
  for(const key in A){
    const r=A[key].root, s=A[key].spot;
    if(k==='box'){ r.style.filter='brightness(.55)'; s.style.opacity=.08; }
    else if(!k||k==='win'){ r.style.filter='brightness(.95)'; s.style.opacity=.45; }
    else { r.style.filter=(key===k)?'brightness(1)':'brightness(.68)'; s.style.opacity=(key===k)?.7:.12; }

}

/* ===== 总控 ===== */
function updBtn(){
  const b=document.getElementById('playBtn');
  b.textContent=!player.started?'▶ 开始演出':(player.paused?'▶ 继续':'⏸ 暂停');
  b.classList.toggle('pulse',!player.started);
  document.getElementById('stage-wrap').classList.toggle('paused',player.paused&&player.started);
  const chips=document.querySelectorAll('.chip');
  for(const c of chips)c.classList.toggle('cur',+c.getAttribute('data-i')===player.cur);
}
async function playFrom(i){
  initAudio();
  player.gen++; const g=player.gen;
  player.paused=false; player.started=true; updBtn();
  document.getElementById('poster').classList.add('off');
  try{
    for(let s=i;s<=6;s++){
      player.cur=s; updBtn();
      await card(s); if(g!==player.gen)throw STOP;
      await RUN[s](); if(g!==player.gen)throw STOP;
      await wait(400);
    }
    document.getElementById('cardNo').textContent='';
    document.getElementById('cardT').textContent='剧 终';
    document.getElementById('cardS').textContent='Portrait Theatre · 谢幕';
    document.getElementById('blackout').classList.add('on'); clearSub();
    await wait(3000);
    player.cur=0; posterTableau();
    document.getElementById('poster').classList.remove('off');
    document.getElementById('blackout').classList.remove('on');
    player.started=false; updBtn();
  }catch(e){ if(e!==STOP)throw e; }
}
function toggle(){
  if(!player.started){ playFrom(1); return; }
  player.paused=!player.paused; updBtn();
}
document.getElementById('playBtn').addEventListener('click',function(e){e.stopPropagation();toggle();});
document.getElementById('replayBtn').addEventListener('click',function(e){e.stopPropagation();playFrom(1);});
document.getElementById('stage-wrap').addEventListener('click',toggle);
window.addEventListener('keydown',function(e){
