<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ui:#0a0a0c;--fg:#d9d4c8}
@media (prefers-color-scheme:light){:root{--ui:#0a0a0c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui);color:var(--fg);font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - 64px)*16/9));aspect-ratio:16/9;overflow:hidden;background:#0e1620;transition:background 1.2s;container-type:inline-size}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.65));pointer-events:none}
#cap{position:absolute;left:7%;right:7%;bottom:3.5%;text-align:center;font-size:2.4cqw;line-height:1.55;min-height:6cqw;color:#f1ece0;text-shadow:0 1px 8px #000,0 0 3px #000}
#cap b{display:block;font-size:1.5cqw;letter-spacing:.35em;margin-bottom:.15em;font-weight:600}
#cap span{opacity:0;animation:ap .3s both}
@keyframes ap{to{opacity:1}}
#card,#start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .9s}
#card{opacity:0;pointer-events:none}#card.on{opacity:1}
#card h1,#start h1{font-size:5cqw;font-weight:600;letter-spacing:.3em;margin:.2em 0;padding-left:.3em}
#card p,#start p{margin:.2em;font-size:1.7cqw;letter-spacing:.2em;opacity:.7}
#start button{margin-top:2.4cqw;font:inherit;font-size:2cqw;letter-spacing:.4em;padding:.7em 1.6em .7em 2em;background:none;color:#e9d9b0;border:1px solid #e9d9b0;cursor:pointer}
#start button:hover,#start button:focus-visible{background:#e9d9b0;color:#000;outline:none}
#bar{height:64px;width:min(100vw,calc((100vh - 64px)*16/9));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 8px}
#bar button{font:inherit;font-size:14px;color:var(--fg);background:none;border:1px solid #3a3832;padding:6px 12px;cursor:pointer;min-width:38px}
#bar button:hover,#bar button:focus-visible{border-color:#e9d9b0;outline:none}
#bar button.cur{background:#e9d9b0;color:#000;border-color:#e9d9b0}
#bar i{width:1px;height:20px;background:#3a3832}
.ch{transition:transform .7s ease-in-out,opacity .8s;pointer-events:none}
.ch *{transition:transform .5s ease-in-out,opacity .4s}
.tk .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.wk .wb{animation:wlk .42s ease-in-out infinite alternate}
@keyframes wlk{to{transform:translateY(-9px)}}
.sob .wb{animation:sb .2s linear infinite alternate}
@keyframes sb{to{transform:translate(2px,3px)}}
.pant .wb{animation:pt .45s ease-in-out infinite alternate}
@keyframes pt{to{transform:translateY(-4px)}}
.tl .aR{animation:tl .3s infinite alternate}
@keyframes tl{from{transform:rotate(-62deg)}to{transform:rotate(-28deg)}}
.tr circle{animation:dr 1.5s infinite}
@keyframes dr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(36px);opacity:0}}
#sv.shk{animation:shk .4s}
@keyframes shk{20%{transform:translate(-10px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}}
@media (prefers-reduced-motion:reduce){#sv.shk{animation:none}}
</style></head><body>
<div id="wrap">
<div id="stage">
<svg id="sv" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<g id="pk"><path d="M-70 -105 L68 -98 L76 -30 L64 36 L72 106 L-72 100 L-62 28 L-78 -34Z" fill="#b5201e" stroke="#7d1212" stroke-width="3"/><path d="M-70 -105 L68 -98 L70 -60 L-74 -66Z" fill="#951918"/><rect x="-62" y="-20" width="124" height="62" fill="#e5b84a" transform="rotate(-2)"/><text x="0" y="26" text-anchor="middle" font-size="44" font-weight="700" fill="#7d1212" font-family="serif">金牌</text><path d="M-40 60 L-12 92 M30 -92 L22 -42 M52 52 L12 100 M-66 -10 L-40 -40" stroke="#e8736a" stroke-width="3" opacity=".55" fill="none"/></g>
</defs>
<g id="sp"><ellipse id="s1" rx="300" ry="420" fill="#fff" filter="url(#bl)" opacity="0" style="transition:transform 1.2s,opacity 1.2s,fill 1.2s"/><ellipse id="s2" rx="300" ry="420" fill="#fff" filter="url(#bl)" opacity="0" style="transition:transform 1.2s,opacity 1.2s,fill 1.2s"/></g>
<g id="pr"></g><g id="chs"></g>
<g id="fg"><g id="pack" style="opacity:0;transition:transform .9s ease,opacity .5s"><use href="#pk"/></g><g id="pad" style="opacity:0;transition:transform .7s ease,opacity .4s"><rect x="-26" y="-34" width="52" height="68" rx="4" fill="#d8cfb4" transform="rotate(-8)"/><path d="M-14 -16 H14 M-14 -4 H14 M-14 8 H6" stroke="#6b6350" stroke-width="3" transform="rotate(-8)"/></g><g id="gh" style="opacity:0;transition:opacity .5s" transform="translate(1290,360) scale(.42) rotate(8)"><use href="#pk"/></g></g>
</svg>
<canvas id="rain" width="960" height="540"></canvas>
<div id="vig"></div>
<div id="cap" aria-live="polite"></div>
<div id="card"></div>
<div id="start"><h1>立绘剧场</h1><p>PORTRAIT THEATRE · CLAUDE SONNET 5.5</p><p>六个片段 · 开启声音效果更佳</p><button id="go">开 幕</button></div>
</div>
<div id="bar"><button id="pp" disabled>暂停</button><button id="rp" disabled>重播</button><i></i><span id="chips"></span><i></i><button id="mu">声音 开</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
let gen=0,paused=false,AC,MG,RG,RF,NB,muted=false,rainI=0,cur=0;
/* ---------- audio ---------- */
function ai(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;RF=AC.createBiquadFilter();RF.type='bandpass';RF.frequency.value=2500;RF.Q.value=.4;RG=AC.createGain();RG.gain.value=0;s.connect(RF);RF.connect(RG);RG.connect(MG);s.start()}
const rainS=(v,f=2500)=>{if(AC){RG.gain.setTargetAtTime(v,AC.currentTime,.5);RF.frequency.setTargetAtTime(f,AC.currentTime,.5)}};
function tn(f,d=.3,ty='sine',v=.12,dl=0,att=.01){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
function bs(d=.1,v=.3,f=800,dl=0){if(!AC)return;const t=AC.currentTime+dl,s=AC.createBufferSource(),l=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;l.type='lowpass';l.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(l);l.connect(g);g.connect(MG);s.start(t,Math.random(),d+.05)}
const bell=()=>{tn(784,1.3,'sine',.16);tn(587,1.8,'sine',.16,.45)},
buzz=()=>{tn(140,.9,'sawtooth',.08);tn(147,.9,'square',.04);bs(.05,.4,2000,.9)},
pat=()=>{bs(.12,.6,300);tn(80,.15,'sine',.3)},
slam=()=>{bs(.6,1,420);tn(52,.6,'sine',.5)},
stp=()=>bs(.05,.2,700),
steps=ms=>{for(let i=0;i<ms/430;i++)setTimeout(stp,i*430)},
pad=()=>[220,277,330,440].forEach((f,i)=>tn(f,4.5,'sine',.07,i*.18,1.4));
/* ---------- characters ---------- */
const SKY={n:['M-9 -430 L9 -430','M-26 -478 L-8 -478','M8 -478 L26 -478'],
smile:['M-16 -438 Q0 -420 16 -438','M-26 -481 L-8 -481','M8 -481 L26 -481'],
sad:['M-10 -427 Q0 -437 10 -427','M-26 -472 L-8 -480','M8 -480 L26 -472'],
hard:['M-11 -430 L11 -432','M-26 -482 L-8 -474','M8 -474 L26 -482'],
shock:['M-5 -428 Q0 -420 5 -428 Q0 -438 -5 -428','M-26 -484 L-8 -488','M8 -488 L26 -484'],
wry:['M-10 -430 Q0 -434 10 -427','M-26 -480 L-8 -487','M8 -476 L26 -474']};
const CH={
ny:{w:42,coat:'#2f5d62',pants:'#1b2226',hair:'#1b1418',skin:'#efd2b8',
hb:'<path d="M-52 -468 Q-58 -400 -42 -366 L42 -366 Q58 -400 52 -468 Q40 -520 0 -520 Q-40 -520 -52 -468Z" fill="#1b1418"/>',
hf:'<path d="M-46 -460 Q-40 -510 0 -510 Q44 -510 46 -460 Q20 -490 -46 -460Z" fill="#1b1418"/><g class="hat" opacity="0"><ellipse cx="0" cy="-494" rx="60" ry="15" fill="#8a2b3a"/><path d="M-42 -494 Q0 -548 42 -494Z" fill="#8a2b3a"/></g>',
dc:'<path d="M-30 -388 Q0 -362 30 -388 L26 -348 Q0 -334 -26 -348Z" fill="#d9a441"/>',
ex:'<g class="bag" opacity="0"><rect x="-76" y="-272" width="46" height="58" rx="8" fill="#8a5a3c"/><path d="M-60 -272 L20 -380" stroke="#8a5a3c" stroke-width="5"/></g><g class="umo" opacity="0"><line x1="-50" y1="-205" x2="-50" y2="-610" stroke="#222" stroke-width="5"/><path d="M-190 -590 Q-50 -700 90 -590 Q40 -620 -50 -592 Q-140 -620 -190 -590Z" fill="#3b4a63"/></g><g class="umc" opacity="0"><line x1="-50" y1="-205" x2="-62" y2="-8" stroke="#1f3a48" stroke-width="7"/></g>'},
nl:{w:54,coat:'#6a6256',pants:'#24262b',hair:'#2a2420',skin:'#e3c19f',
hb:'',hf:'<path d="M-46 -462 Q-52 -510 0 -510 Q52 -510 46 -462 Q20 -486 -46 -462Z" fill="#2a2420"/>',
dc:'<path d="M-32 -382 L0 -328 L32 -382 L44 -396 L0 -368 L-44 -396Z" fill="#4e483f"/><rect x="-62" y="-250" width="124" height="12" fill="#3a352d"/>',ex:''},
mg:{w:74,coat:'#7a5230',pants:'#2c2118',hair:'#4a4a4a',skin:'#f0c9a6',
hb:'',hf:'<path d="M-46 -465 Q-40 -508 0 -508 Q44 -508 46 -465 Q10 -490 -46 -465Z" fill="#4a4a4a"/><path d="M-18 -442 Q0 -450 18 -442 Q0 -436 -18 -442Z" fill="#3a3a3a"/>',
dc:'<path d="M-34 -386 L0 -326 L34 -386Z" fill="#eee"/><path d="M-9 -382 L9 -382 L13 -300 L0 -278 L-13 -300Z" fill="#c2332f"/>',ex:''},
wk:{w:46,coat:'#3b5b3b',pants:'#2f472f',hair:'#222',skin:'#d8b08c',
hb:'',hf:'<path d="M-46 -468 Q0 -528 46 -468Z" fill="#d9822b"/><rect x="-6" y="-476" width="74" height="9" rx="4" fill="#d9822b"/>',dc:'',ex:''}};
function mk(id,c){const w=c.w,arm=s=>`<g class="${s<0?'aL':'aR'}" style="transform-origin:${s*w}px -372px"><line x1="${s*w}" y1="-372" x2="${s*w+s*8}" y2="-212" stroke="${c.coat}" stroke-width="30" stroke-linecap="round"/><circle cx="${s*w+s*8}" cy="-200" r="15" fill="${c.skin}"/></g>`;
return `<g id="${id}" class="ch" style="opacity:0"><ellipse cx="0" cy="2" rx="${w+34}" ry="13" fill="#000" opacity=".35"/><g class="in"><g class="lean"><g class="wb">
<rect x="${-w*.62}" y="-170" width="${w*.5}" height="170" fill="${c.pants}"/><rect x="${w*.12}" y="-170" width="${w*.5}" height="170" fill="${c.pants}"/>
<path d="M${-w} -372 Q0 -396 ${w} -372 L${w*1.2} -120 L${-w*1.2} -120Z" fill="${c.coat}"/>${c.dc}${arm(-1)}${arm(1)}
<rect x="-12" y="-420" width="24" height="40" fill="${c.skin}"/>
<g class="hd" style="transform-origin:0px -410px"><g class="bob">${c.hb}<circle cx="0" cy="-455" r="44" fill="${c.skin}"/>
<g class="face"><g class="eyes"><circle cx="-16" cy="-455" r="4.5" fill="#222"/><circle cx="16" cy="-455" r="4.5" fill="#222"/></g><g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"><path class="bl"/><path class="br"/><path class="mo"/></g><g class="tr" opacity="0"><circle cx="-18" cy="-446" r="4" fill="#9fd8ff"/><circle cx="18" cy="-446" r="4" fill="#9fd8ff"/></g></g>
<circle class="bk" cx="0" cy="-455" r="45" fill="${c.hair}" opacity="0"/>${c.hf}</g></g>${c.ex}</g></g></g></g>`}
const G={};
for(const id of['nl','mg','wk','ny']){$('#chs').insertAdjacentHTML('beforeend',mk(id,CH[id]));const g=$('#'+id);g.st={x:-400,y:790,s:1};G[id]=g}
function P(id,o){const g=G[id],q=s=>g.querySelector(s),st=g.st;g.style.transitionDuration=(o.d??700)+'ms';
for(const k of['x','y','s'])if(k in o)st[k]=o[k];
if('x'in o||'y'in o||'s'in o)g.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.s})`;
if('show'in o)g.style.opacity=o.show;
if('f'in o)q('.in').style.transform=`scaleX(${o.f?-1:1})`;
if('b'in o)q('.lean').style.transform=`rotate(${o.b}deg)`;
if('h'in o)q('.hd').style.transform=`rotate(${o.h}deg)`;
if('al'in o)q('.aL').style.transform=`rotate(${o.al}deg)`;
if('ar'in o)q('.aR').style.transform=`rotate(${o.ar}deg)`;
if(o.face){const f=SKY[o.face];q('.mo').setAttribute('d',f[0]);q('.bl').setAttribute('d',f[1]);q('.br').setAttribute('d',f[2])}
if('tr'in o)q('.tr').style.opacity=o.tr;
if('look'in o)q('.eyes').style.transform=`translateX(${o.look}px)`;
if('back'in o){q('.face').style.opacity=o.back?0:1;q('.bk').style.opacity=o.back?1:0}
for(const k of['hat','bag','umo','umc'])if(k in o){const e=q('.'+k);if(e)e.style.opacity=o[k]}
if(o.cl)for(const c in o.cl)g.classList.toggle(c,!!o.cl[c])}
function sp(n,x=800,sc=1,op=.15,c='#fff'){const e=$('#s'+n);e.style.transform=`translate(${x}px,470px) scale(${sc})`;e.style.opacity=op;e.style.fill=c}
const pk=(x,y,s,o,r=0)=>{const p=$('#pack');p.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;p.style.opacity=o};
const pd=(x,y,o)=>{const p=$('#pad');p.style.transform=`translate(${x}px,${y}px)`;p.style.opacity=o};
const op=(s,v)=>$(s).style.opacity=v;
/* ---------- timing & captions ---------- */
const sleep=async(ms,k)=>{let t=0;while(t<ms){if(k!==gen)throw 0;await new Promise(r=>setTimeout(r,50));if(!paused)t+=50}if(k!==gen)throw 0};
const NM={ny:['夜 莺','#8fd9d0'],nl:['尼 尔','#f0cf8a'],mg:['经 理','#f4907c']};
const cap=$('#cap'),cc=()=>cap.innerHTML='';
function H(k){const w=ms=>sleep(ms,k);
const say=async(who,text,o)=>{if(k!==gen)throw 0;const n=NM[who];cap.innerHTML=`<b style="color:${n[1]}">${n[0]}${o?'（电铃）':''}</b>`+[...text].map((c,i)=>`<span style="animation-delay:${i*48}ms">${c}</span>`).join('');
if(o){op('#sg',1);const iv=setInterval(()=>op('#sg',Math.random()>.5?1:.55),160);try{await w(450+text.length*105)}finally{clearInterval(iv);op('#sg',0)}}
else{G[who].classList.add('tk');try{await w(450+text.length*105)}finally{G[who].classList.remove('tk')}}};
const go=(id,x,ms,o={})=>{P(id,{x,d:ms,cl:{wk:1},...o});steps(ms);setTimeout(()=>{if(k===gen)P(id,{cl:{wk:0}})},ms)};
return{w,say,go}}
/* ---------- scenes ---------- */
const S=[
{n:'片段一',t:'雨夜求助',l:'夜晚，公寓楼下，外面下着雨',bg:'#0e1620',rv:1,ra:[.5,3200],
pr:`<g transform="translate(1180,250)"><rect width="280" height="540" fill="#18202b" stroke="#2c3a4e" stroke-width="6"/><rect id="dl" x="14" y="14" width="252" height="512" fill="#f4cf80" opacity="0" style="transition:opacity .8s"/><g id="leaf" style="transform-origin:14px 0;transition:transform .8s"><rect x="14" y="14" width="252" height="512" fill="#222c3a"/><rect x="40" y="44" width="200" height="200" fill="none" stroke="#2f3d52" stroke-width="4"/><rect x="40" y="280" width="200" height="200" fill="none" stroke="#2f3d52" stroke-width="4"/><circle cx="236" cy="290" r="10" fill="#c9a45c"/></g></g>
<g transform="translate(1020,330)"><rect width="90" height="190" rx="8" fill="#2a3342" stroke="#51627e" stroke-width="3"/><g stroke="#51627e" stroke-width="3"><line x1="22" y1="20" x2="68" y2="20"/><line x1="22" y1="30" x2="68" y2="30"/><line x1="22" y1="40" x2="68" y2="40"/></g><circle id="sg" cx="45" cy="30" r="30" fill="#ffbf55" opacity="0" style="transition:opacity .25s"/><g fill="#444"><circle cx="62" cy="80" r="12"/><circle cx="62" cy="120" r="12"/><circle cx="62" cy="160" r="12"/></g><circle id="bt" cx="62" cy="80" r="12" fill="#ffbf55" opacity="0" style="transition:opacity .2s"/><g fill="#9fb0c8" font-size="14" font-family="sans-serif"><text x="8" y="85">301</text><text x="8" y="125">302</text><text x="8" y="165">303</text></g></g>`,
init(){P('ny',{d:0,show:1,x:-150,um:0,umo:1,hat:1,face:'n'});sp(1,860,.9,.2,'#8fb4e8')},
async run(k){const{w,say,go}=H(k);
await w(600);go('ny',868,3000);await w(3300);
P('ny',{ar:-90,h:-3});await w(900);bell();op('#bt',1);P('ny',{ar:-83,d:150});await w(900);P('ny',{ar:0});
await say('ny','尼尔先生？');op('#bt',0);await w(300);
await say('nl','是，你是？',1);
P('ny',{face:'smile'});await say('ny','我听朋友说起过你，我遇到了一些麻烦，我想请你帮忙。');
P('ny',{face:'sad'});await say('nl','现在很晚了，而且……',1);
P('ny',{face:'n',h:-2,x:880,d:400});await say('ny','就几分钟，先生，而且这事有点急，我怕明天就太晚了。');
cc();P('ny',{face:'sad',h:7});rainS(.75,3600);sp(1,860,.7,.1,'#8fb4e8');op('#sg',.25);await w(500);op('#sg',0);await w(2600);
P('ny',{h:0,face:'n'});sp(1,860,.9,.16,'#8fb4e8');await say('ny','可以吗？');cc();await w(900);
buzz();await w(900);op('#dl',.95);$('#leaf').style.transform='scaleX(.12)';sp(2,1330,.8,.2,'#f4cf80');P('ny',{face:'smile',h:-2});await w(1300);
go('ny',1250,2600);P('ny',{h:0,face:'n'});await w(1800);P('ny',{show:0,d:900});await w(1500)}},

{n:'片段二',t:'看见烟盒',l:'尼尔与夜莺见面，他刚追丢了收取勒索款的人',bg:'#14171e',rv:.35,ra:[.18,3000],pr:'',
init(){P('nl',{d:0,show:1,x:-150,b:8,h:5,face:'hard',cl:{pant:1}});P('ny',{d:0,show:1,x:1130,f:1,face:'sad',ar:30,al:-30});pk(690,470,.01,0);sp(1,480,.9,.13,'#9ab0c8');sp(2,1130,.9,.12,'#9ab0c8')},
async run(k){const{w,say,go}=H(k);
await w(500);go('nl',470,1800);await w(2000);
P('nl',{ar:-50});await say('nl','我没追到他，该死，在路口的时候突然窜出一辆摩托，我把它跟丢了。');P('nl',{ar:0});
P('ny',{x:1090,h:4});await say('ny','你人没事儿就好。');
P('nl',{ar:-70,b:3,face:'n',cl:{pant:0}});await w(400);pk(690,470,.32,1);await say('nl','我拿到了这个。');
pk(800,330,1.25,1,-5);sp(1,800,.8,.3,'#ffcf8a');sp(2,1130,.8,.05);P('nl',{ar:0});P('ny',{face:'shock',h:0});await w(1700);
op('#gh',.4);await w(500);op('#gh',0);await w(300);op('#gh',.3);await w(400);op('#gh',0);
await say('ny','这是……他的？');
