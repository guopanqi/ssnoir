<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物路径 · 原路收线试验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#ccd3dc;font:16px Georgia,serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:25px;font-weight:400;margin:8px 0}p{color:#8b9aaa;line-height:1.6}a{color:#ccb878}svg{display:block;width:100%;background:#05080d;border:1px solid #273441;aspect-ratio:16/9}path{fill:none;stroke-linecap:round;stroke-linejoin:round}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{background:#111922;color:#ded8c3;border:1px solid #45515e;padding:10px 16px;font:inherit}label{display:flex;align-items:center;gap:8px}input[type=range]{flex:1;min-width:180px;accent-color:#d2bb7c}output{min-width:160px;color:#d2bb7c}.hint{font-size:14px}
</style><main><a href="./">返回人物画风剧场</a><h1>描线入场，原图定场</h1><p>布景由路径绘制，人物并行描线后渐变到原图；退场先回到路径，再沿原路收线。</p>
<svg id="stage" viewBox="0 0 1600 900" aria-label="夜莺路径描绘试演"><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter></defs><g id="world"></g><g id="backing" transform="translate(580 265) scale(.51)"></g><g id="actor" transform="translate(580 265) scale(.51)"></g><g id="original" transform="translate(580 265) scale(.51)" opacity="0"></g><text x="70" y="75" fill="#8d9eb5" font-size="19" id="phase"></text></svg>
<div class="controls"><button id="play">暂停</button><button id="restart">从头重播</button><label>速度<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input id="use-original" type="checkbox" checked>定场使用原图</label><label><input id="mask" type="checkbox" checked>轮廓遮挡</label><label><input id="glow-toggle" type="checkbox" checked>路径辉光</label></div>
<div class="controls"><label for="time">进度</label><input id="time" type="range" min="0" max="22" step=".01" value="0"><output id="readout"></output></div><p class="hint">0–5 秒：布景描出；4–6.5 秒：人物并行描出；6.5–7.3 秒：渐变到原图；7.3–14 秒：原图定场；14–14.8 秒：渐变回路径；14.8–22 秒：原路收线。原图与路径使用相同画幅、位置与缩放；遮挡仍由轮廓路径填充。人物路径是已有骨架的自动提取初稿。</p>
</main><script type="module" src="path-study.js"></script></html>
