<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>路灯下 · 人物画风剧场</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>SSNOIR / CAST & LINE STAGE</small><h1>路灯下，未说出的名字</h1></div><p>只替换夜莺 · 尼尔固定 C1 · 同姿势比较画风</p></header>
<main><div class="workspace"><section class="preview-column" aria-label="演出预览"><div class="stage" id="stage"><img class="world" src="assets/world.png" alt="Unity 格兰德酒店建筑远景"><div class="veil"></div><svg class="set" viewBox="0 0 1600 900" aria-hidden="true"></svg><svg class="shadows" viewBox="0 0 1600 900" aria-hidden="true"><g class="neil-shadow"><ellipse cx="0" cy="740" rx="74" ry="12"/><path d="M-12 738L-150 854L-106 855L19 743"/></g><g class="night-shadow"><ellipse cx="0" cy="740" rx="57" ry="10"/><path d="M-8 741L120 854L158 850L15 738"/></g></svg><div class="focus-blur"></div><div class="speech-glow"></div><div class="actor neil"><img src="assets/neil.png" alt="尼尔"></div><div class="actor night"><img src="assets/nightingale.png" alt="夜莺"></div><div class="iris"></div><div class="grain"></div><div class="vignette"></div><div class="scene-label"></div><div class="caption"><b></b><span></span></div></div>
<section class="transport" aria-label="故事播放"><button id="play">播放完整故事</button><button id="restart">从头重播</button><button id="prev">上一拍</button><button id="next">下一拍</button><button id="sound">声音 开</button><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option></select></label><span id="cue-label"></span><label class="timeline">进度 <input id="progress" type="range" min="0" max="100" value="0" step="0.1"><output id="time"></output></label></section>
</section><aside class="editor-sidebar" aria-label="画面编辑"><h2>画面编辑</h2><section class="controls" aria-label="人物风格"><h3>人物风格</h3><div><span>人物画风 · 夜莺</span><div id="cast-options"></div><button id="cast-compare">画风并排比较</button></div></section><button id="style-treatment">使用本画风推荐描线</button><details id="ink-editor" open></details><section class="controls" aria-label="布景与画面"><h3>布景与画面</h3><div class="scene-switches"><button id="mask">光孔遮罩 开</button><button id="reaction">背景反应 开</button></div><div><span>实验布景</span><button data-scene="lamp">路灯下</button><button data-scene="warehouse">仓库檐下</button></div><div><span>远景</span><button data-bg="absent">完全退场</button><button data-bg="fog">重度失焦</button><button data-bg="trace">3D 轮廓残影</button><label>模糊 <input id="blur" type="range" min="0" max="48" value="28"><output id="blur-value">28</output></label><label>残留 <input id="opacity" type="range" min="0" max="60" value="24"><output id="opacity-value">24%</output></label></div><div><span>画面融合</span><button data-person="raw">画稿原色</button><button data-person="tone">低饱和调色</button><button data-person="light">共同受光与投影</button><label>线条 <input id="lines" type="range" min="15" max="100" value="65"><output id="lines-value">65%</output></label><button id="bg-compare">三种远景对照</button></div></section>

<footer><p id="note"></p><p>切换画风和参数保留当前对白、时间与站位。新画稿为探索方案；旧稿可作对照。沿用 Claude 路灯戏的逐字字幕、脚步、电流声、灯光节拍与离场停顿；人物保持同一姿势以比较画风。</p></footer></aside></div><section id="comparison" hidden><p id="comparison-note"></p><div class="comparison-grid" id="comparison-grid"></div></section>
</main><script type="module" src="main.js"></script></body></html>
